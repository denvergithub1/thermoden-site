<style>
/* =====================================================================
   Design system v2: bold sans type, vivid colour, waves, illustration.
   Two palettes (spring / harbour), one structure.
   ===================================================================== */
:root{
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ink:#0d2327; --muted:#47615f; --line:#d4e2de; --card:#fff; --danger:#a1342b; --field:#6f8079;
  --amber:#f5ae3c; --on-amber:#201603; --amber-d:#e39a22;
  --radius:20px; --radius-sm:12px;
  --shadow:0 10px 28px -14px rgba(7,47,52,.35); --shadow-lg:0 26px 60px -26px rgba(7,47,52,.55);
  color-scheme:light;
}
html[data-site="thermogen"]{
  --deep:#062e33; --deep-2:#0a4950; --on-deep:#cfe9e5; --aqua:#2bc4b4; --paper:#f3f8f6; --tint:#e0f1ed; --sand:#f5ebcf;
  --link:#0b766d; --hot:#b5451d; --gold-ink:#74600f;
  --s1:#ead9a6; --s2:#e2b92f; --s3:#d9572b; --s4:#1fa597; --s5:#0a4950; --card-tint:#f6fbf9;
}
html[data-site="thermoden"]{
  --deep:#0e2850; --deep-2:#173e75; --on-deep:#d2e0f5; --aqua:#2ec0cf; --paper:#f3f6fb; --tint:#e1eaf7; --sand:#f6ecd4;
  --link:#0a6a8c; --hot:#a8481a; --gold-ink:#74600f; --ink:#0f2038; --muted:#475b7a; --line:#d3deee; --field:#6e7f99;
  --s1:#f0dfb0; --s2:#e8b53a; --s3:#e2734a; --s4:#22a9b6; --s5:#173e75; --card-tint:#f6f9fd;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font:400 1.0625rem/1.65 var(--sans);color:var(--ink);background:var(--paper);min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
img,svg{max-width:100%}
a{color:var(--link)}
a:hover{color:var(--deep)}
h1,h2,h3,h4{font-family:var(--sans);font-weight:800;line-height:1.08;margin:0;color:var(--deep);letter-spacing:-.025em;text-wrap:balance}
h1{font-size:clamp(2.35rem,5.6vw,4.1rem);letter-spacing:-.032em}
h2{font-size:clamp(1.75rem,3.4vw,2.55rem)}
h3{font-size:1.3rem;font-weight:750;letter-spacing:-.018em}
h4{font-size:1.05rem;font-weight:750;letter-spacing:-.01em}
p{margin:0 0 1em;max-width:66ch}
ul,ol{margin:0 0 1em;padding-left:1.25rem}
li{margin:.3em 0}
small{font-size:.88em}
:focus-visible{outline:3px solid var(--deep-2);outline-offset:3px;border-radius:6px}
.site-header :focus-visible,.site-footer :focus-visible,.dark :focus-visible,.hero :focus-visible,.pagehead :focus-visible,.chat-panel header :focus-visible,.core-detail :focus-visible{outline-color:#fff}
h1:focus,h1:focus-visible{outline:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:.75rem;top:-4rem;background:#fff;color:var(--deep);padding:.6rem .9rem;border-radius:10px;z-index:200;font-weight:700}
.skip:focus{top:.75rem}
[hidden]{display:none!important}
.wrap{width:min(1160px,100% - 2.5rem);margin-inline:auto}
.narrow{max-width:780px}
.section{padding:clamp(2.8rem,6.5vw,5rem) 0}
.section.tint{background:var(--tint)}
.section.white{background:#fff}
.section.dark{background:var(--deep);color:var(--on-deep)}
.section.dark h2,.section.dark h3,.section.dark h4{color:#fff}
.section.dark a{color:#fff}
.lede{font-size:clamp(1.08rem,1.6vw,1.28rem);color:var(--muted);max-width:60ch;line-height:1.55}
.dark .lede,.hero .lede,.pagehead .lede{color:var(--on-deep)}
.head{margin-bottom:2.2rem}
.head h2{margin-bottom:.8rem}
.muted{color:var(--muted)}
.note{font-size:.93rem;color:var(--muted)}

/* ---------- Waves ---------- */
.wave{display:block;line-height:0;background:var(--w-from,var(--deep));margin-top:-1px}
.wave svg{display:block;width:100%;height:clamp(38px,6vw,86px)}
.wave path{fill:var(--w-to,var(--paper))}
.strata-wave{line-height:0}
.strata-wave svg{display:block;width:100%;height:clamp(40px,6vw,78px)}

/* ---------- Header ---------- */
.site-header{background:var(--deep);position:sticky;top:0;z-index:50}
.site-header .wrap{display:flex;align-items:center;gap:1rem;min-height:68px}
.brand{display:flex;align-items:center;gap:.7rem;color:#fff;text-decoration:none;font:800 1.3rem/1 var(--sans);letter-spacing:-.03em;white-space:nowrap}
.brand:hover{color:#fff}
.brand svg{width:184px;height:30px;flex:none;display:block}
@media(max-width:420px){.brand svg{width:147px;height:24px}}
.nav{margin-left:auto;display:flex;align-items:center;gap:.1rem}
.nav a{color:var(--on-deep);text-decoration:none;font-weight:650;font-size:.92rem;padding:.5rem .65rem;border-radius:99px;white-space:nowrap}
.nav a:hover{color:#fff;background:rgba(255,255,255,.1)}
.nav a[aria-current="page"]{color:#fff;background:rgba(255,255,255,.14)}
.nav .ext{border:1.5px solid rgba(255,255,255,.35);margin-left:.25rem;padding:.42rem .8rem}
.nav .ext:hover{border-color:#fff}
.nav .cta{background:var(--amber);color:var(--on-amber);margin-left:.25rem;font-weight:800;padding:.52rem 1rem}
.nav .cta:hover{background:#fff;color:var(--deep)}
.nav-toggle{display:none;margin-left:auto;background:none;border:1.5px solid rgba(255,255,255,.4);color:#fff;border-radius:99px;padding:.5rem .9rem;font:700 .95rem var(--sans);cursor:pointer}
@media(max-width:1140px){
  .nav-toggle{display:inline-block}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--deep);flex-direction:column;align-items:stretch;padding:.5rem 1.25rem 1.2rem;border-top:1px solid rgba(255,255,255,.15);box-shadow:0 20px 40px -20px rgba(0,0,0,.5)}
  .nav.open{display:flex}
  .nav a{padding:.85rem .9rem}
  .nav .ext,.nav .cta{margin:.35rem 0 0;text-align:center}
}

/* ---------- Buttons and forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font:800 1rem/1.2 var(--sans);text-align:center;padding:1rem 1.6rem;border-radius:99px;border:2px solid transparent;cursor:pointer;text-decoration:none;background:var(--deep);color:#fff;min-height:52px;transition:transform .15s,background .15s,box-shadow .15s;letter-spacing:-.005em}
.btn:hover{background:var(--deep-2);color:#fff;transform:translateY(-2px);box-shadow:0 12px 24px -12px rgba(7,47,52,.6)}
.btn.accent{background:var(--amber);color:var(--on-amber)}
.btn.accent:hover{background:var(--amber-d);color:var(--on-amber)}
.btn.ghost{background:transparent;color:var(--deep);border-color:var(--deep)}
.btn.ghost:hover{background:var(--deep);color:#fff}
.dark .btn.ghost,.hero .btn.ghost,.pagehead .btn.ghost{color:#fff;border-color:rgba(255,255,255,.7)}
.dark .btn.ghost:hover,.hero .btn.ghost:hover,.pagehead .btn.ghost:hover{background:#fff;color:var(--deep)}
.btn.small{min-height:42px;padding:.65rem 1.1rem;font-size:.92rem}
.btn.danger{background:transparent;color:var(--danger);border-color:#e4bdb8}
.btn.danger:hover{background:#fbeceb;color:var(--danger);box-shadow:none}
.btn[disabled]{opacity:.6;cursor:progress;transform:none}
.actions{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.6rem}
.f{display:grid;gap:1.1rem}
.field label,.field .lbl{display:block;font-weight:700;font-size:.95rem;margin-bottom:.4rem}
.field .hint{font-weight:400;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;font:400 1rem/1.4 var(--sans);padding:.85rem 1rem;border-radius:14px;border:1.5px solid var(--field);background:#fff;color:var(--ink);min-height:52px}
.field textarea{min-height:140px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--link);outline:3px solid rgba(43,196,180,.35)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:600px){.row2{grid-template-columns:1fr}}
.check{display:flex;gap:.65rem;align-items:flex-start;font-size:.95rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.15rem;accent-color:var(--link);flex:none}
.err{color:var(--danger);font-weight:700;font-size:.93rem;min-height:1.2em;margin:0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem 1.6rem;box-shadow:var(--shadow)}
.callout{border-left:6px solid var(--amber);background:#fff;padding:1.1rem 1.4rem;border-radius:0 var(--radius-sm) var(--radius-sm) 0;box-shadow:var(--shadow)}
.callout p:last-child{margin-bottom:0}

/* ---------- Page heads (inner pages) ---------- */
.pagehead{background:var(--deep);color:var(--on-deep);position:relative;overflow:hidden;padding:clamp(2.4rem,6vw,4rem) 0 clamp(1.4rem,3vw,2rem)}
.pagehead h1{color:#fff;max-width:20ch}
.pagehead .lede{margin-top:1.1rem}
.pagehead .rings{position:absolute;right:-60px;top:-60px;width:420px;height:420px;opacity:.5;pointer-events:none}
.pagehead .wrap{position:relative}

/* ---------- Home heroes ---------- */
.hero{background:var(--deep);color:var(--on-deep);padding:clamp(1.6rem,4vw,3rem) 0 clamp(2rem,5vw,3.2rem);position:relative;overflow:hidden}
.hero .rings{position:absolute;right:-120px;top:-100px;width:640px;height:640px;opacity:.55;pointer-events:none}
.hero h1{color:#fff;max-width:18ch;font-size:clamp(2.3rem,4.7vw,3.6rem)}
.hero .lede{margin:1.2rem 0 0}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(1.5rem,4vw,3.5rem);align-items:center;position:relative}
@media(max-width:940px){.hero-grid{grid-template-columns:1fr}}
.hero.light{background:var(--deep)}
.finder .btn.ghost{color:var(--deep);border-color:var(--deep)}
.finder .btn.ghost:hover{background:var(--deep);color:#fff}
.hero .wrap{z-index:1}

/* ThermoGenBio: the cutaway (spring scene + clickable layers) */
.cutaway{background:var(--deep-2);border-radius:26px;overflow:hidden;box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.14)}
.scene{display:block;width:100%;height:auto}
.steam path{animation:steam 7s ease-in-out infinite;transform-origin:center bottom}
.steam path:nth-child(2){animation-delay:-2.4s}.steam path:nth-child(3){animation-delay:-4.6s}
@keyframes steam{0%,100%{transform:translateY(6px);opacity:.28}50%{transform:translateY(-8px);opacity:.5}}
.bubble-dot{animation:bub 4s ease-in-out infinite}
.bubble-dot:nth-of-type(2n){animation-delay:-1.7s}
@keyframes bub{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(-5px);opacity:1}}
.corelog{display:grid;grid-template-columns:2.6rem 1fr;gap:.5rem;padding:.7rem .9rem 0}
.ticks{display:flex;flex-direction:column;justify-content:space-between;font-size:.78rem;color:var(--on-deep);padding:.35rem 0;text-align:right;font-weight:650}
.core{display:flex;flex-direction:column;gap:4px;height:290px}
.layer{flex:1;border:0;border-radius:10px;cursor:pointer;text-align:left;padding:0 1.1rem;font:800 1rem/1.2 var(--sans);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:.5rem;transition:flex .35s ease,filter .2s,transform .2s;position:relative;overflow:hidden}
.layer:hover{filter:brightness(1.1)}
.layer[aria-pressed="true"]{flex:2.1;box-shadow:inset 0 0 0 3px #fff}
.layer .tag{font-weight:650;font-size:.82rem;opacity:.95}
.layer.l1{background:repeating-linear-gradient(90deg,#ead9a6 0 9px,#dcc98d 9px 11px);color:#2a2208}
.layer.l2{background:repeating-linear-gradient(90deg,#c04317 0 14px,#ad3a12 14px 17px)}
.layer.l3{background:repeating-linear-gradient(90deg,#7a6618 0 11px,#6b5814 11px 14px)}
.layer.l4{background:repeating-linear-gradient(90deg,#0f766e 0 12px,#0c6962 12px 15px)}
.layer.l5{background:repeating-linear-gradient(90deg,#0a2f34 0 16px,#082a2e 16px 19px)}
.core-detail{grid-column:1 / -1;margin:.7rem -.9rem 0;background:rgba(0,0,0,.26);padding:1rem 1.2rem 1.1rem;color:#fff}
.core-detail h3{color:#fff;font-size:1.12rem;margin-bottom:.3rem}
.core-detail p{margin:0 0 .6rem;font-size:.97rem;color:var(--on-deep)}
.core-detail a{color:#fff;font-weight:800}
@media(prefers-reduced-motion:reduce){.layer{transition:none}.steam path,.bubble-dot{animation:none}}
@media(max-width:600px){.core{height:270px}}

/* ThermoDen: service finder */
.finder{background:#fff;border-radius:26px;padding:1.5rem 1.6rem;color:var(--ink);box-shadow:var(--shadow-lg);position:relative}
.finder h2{font-size:1.45rem;margin-bottom:1rem;color:var(--deep)}
.chips{display:flex;flex-wrap:wrap;gap:.55rem}
.chip{font:750 .93rem var(--sans);padding:.65rem 1rem;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;min-height:46px;transition:transform .12s,border-color .12s}
.chip:hover{border-color:var(--link);transform:translateY(-1px)}
.chip[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
.finder-result{margin-top:1.1rem;background:var(--tint);border-radius:18px;padding:1.1rem 1.2rem}
.finder-result h3{margin-bottom:.35rem;font-size:1.15rem}
.finder-result p{margin:0 0 .9rem;font-size:.98rem}

/* ---------- Grids and cards ---------- */
.grid{display:grid;gap:1.4rem}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-top:7px solid var(--aqua);border-radius:var(--radius);padding:1.5rem 1.5rem 1.6rem;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg)}
.card.c2{border-top-color:var(--amber)}.card.c3{border-top-color:var(--s3)}.card.c4{border-top-color:var(--deep-2)}
.card h3,.card h4{margin-bottom:.55rem}
.card p:last-child{margin-bottom:0}
.tagline{display:inline-block;font-weight:750;font-size:.88rem;padding:.25rem .75rem;border-radius:99px;background:var(--tint);color:var(--deep);margin-bottom:.7rem}
.stage{font-size:.9rem;color:var(--hot);font-weight:750}
.pico{width:3.6rem;height:3.6rem;border-radius:50%;background:#0d7a6e;color:#fff;display:grid;place-items:center;margin-bottom:1rem;box-shadow:0 8px 18px -8px rgba(13,122,110,.8)}
.pico svg{width:1.8rem;height:1.8rem}
.card.c2 .pico{background:#b3610d}.card.c3 .pico{background:#9a3d17}
.areas{font-size:.92rem;color:var(--muted);margin:-.2rem 0 .8rem;font-weight:600}
.link-arrow{font-weight:800;text-decoration:none}
.link-arrow::after{content:" \2192"}

/* Fact tiles: three coloured panels */
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.2rem}
.fact{padding:1.8rem 1.7rem;border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column}
.fact:nth-child(1){background:var(--deep-2);color:#fff}
.fact:nth-child(2){background:var(--amber);color:var(--on-amber)}
.fact:nth-child(3){background:var(--aqua);color:#042b2f}
.fact b{display:block;font:800 clamp(2rem,3.4vw,2.7rem)/1.05 var(--sans);letter-spacing:-.03em;margin-bottom:.7rem;font-variant-numeric:tabular-nums}
.fact p{margin:0;font-size:1rem;line-height:1.5}
.fact small{display:block;margin-top:auto;padding-top:1rem;opacity:.9;font-size:.84rem;font-weight:600}
.fact:nth-child(2) small,.fact:nth-child(3) small{opacity:.85}
@media(max-width:860px){.facts{grid-template-columns:1fr}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.5rem,4vw,3.2rem);align-items:start}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.list-plain{list-style:none;padding:0}
.list-plain li{padding:.5rem 0;border-bottom:1px solid var(--line)}
.list-plain li:last-child{border-bottom:0}
.partner{display:grid;grid-template-columns:3rem 1fr;gap:1rem;align-items:start;background:#fff;border-radius:var(--radius);padding:1.2rem 1.3rem;box-shadow:var(--shadow);border:1px solid var(--line)}
.partner .dot{width:3rem;height:3rem;border-radius:14px;display:grid;place-items:center;color:#fff;background:var(--deep-2)}
.partner .dot svg{width:1.5rem;height:1.5rem}
.partner:nth-child(2) .dot{background:#9a3d17}.partner:nth-child(3) .dot{background:#0d7a6e}
.partner p{margin:0;font-size:.97rem}

/* Services (ThermoDen) */
.svc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4rem}
@media(max-width:860px){.svc-grid{grid-template-columns:1fr}}
.service{display:grid;grid-template-columns:4rem 1fr;gap:1.1rem;padding:1.6rem;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);scroll-margin-top:90px}
.service.hl{outline:4px solid var(--amber);outline-offset:3px}
.service .ico{width:4rem;height:4rem;border-radius:18px;background:var(--deep-2);color:#fff;display:grid;place-items:center}
.service:nth-child(3n+2) .ico{background:#9a3d17}.service:nth-child(3n) .ico{background:#0d7a6e}
.service .ico svg{width:2rem;height:2rem}
.service h3{margin-bottom:.35rem}
.service h4{font-size:.95rem;margin:1rem 0 .3rem;color:var(--hot)}
.service ul{margin-bottom:.3rem}
.service.big{grid-template-columns:1fr;padding:2rem 2.2rem;margin-bottom:1.6rem}
.mini{display:grid;grid-template-columns:3rem 1fr;gap:.9rem;align-items:start;text-decoration:none;color:inherit;padding:1.1rem;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s}
.mini:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.mini .ico{width:3rem;height:3rem;border-radius:14px;background:var(--deep-2);color:#fff;display:grid;place-items:center}
.mini:nth-child(3n+2) .ico{background:#9a3d17}.mini:nth-child(3n) .ico{background:#0d7a6e}
.mini .ico svg{width:1.5rem;height:1.5rem}
.mini b{color:var(--deep);font-weight:800;line-height:1.2;display:block;margin-bottom:.2rem}
.mini small{color:var(--muted)}

/* Process steps (a real sequence) */
.steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.3rem;counter-reset:step}
@media(max-width:900px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.steps{grid-template-columns:1fr}}
.steps li{counter-increment:step;margin:0;padding:1.4rem 1.3rem 1.5rem;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);position:relative}
.steps li::before{content:counter(step);display:grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--amber);color:var(--on-amber);font:800 1.15rem var(--sans);margin-bottom:.8rem}
.steps h4{margin-bottom:.35rem}

const SESSION_ID = (() => { try { let v = sessionStorage.getItem("th_sid"); if (!v) { v = crypto.randomUUID(); sessionStorage.setItem("th_sid", v); } return v; } catch { return crypto.randomUUID(); } })();
let lastTrack = "";
let adminCheckDone; const adminCheck = new Promise(r => { adminCheckDone = r; });
const isAdminBrowser = () => state.isAdmin === true || store.get("admin", false) === true;
async function track(path){
  try {
    if (DEMO || navigator.doNotTrack === "1" || navigator.globalPrivacyControl === true || isAdminBrowser()) return;
    await Promise.race([adminCheck, new Promise(r => setTimeout(r, 4000))]);
    if (isAdminBrowser() || !/^\/[a-z-]{0,30}$/.test(path)) return;
    const key = path + "|" + Math.floor(Date.now() / 3000); if (key === lastTrack) return; lastTrack = key;
    let ref = "";
    if (!sessionStorage.getItem("th_ref")) {
      sessionStorage.setItem("th_ref", "1");
      try { if (document.referrer) { const h = new URL(document.referrer).hostname; if (h && h !== location.hostname) ref = h; } } catch {}
    }
    api.track({site:SITE.id, path, referrer:ref.slice(0, 200), session_id:SESSION_ID});
  } catch {}
}

/* Horizontal bar chart with a text-table fallback. rows: [{label, bars:[{v, note}]}], legend: [[name, colour]] */
function chart({title, unit, legend, rows, src, fmt}){
  const W = 640, left = 190, right = 190, bh = 20, gap = 6, rowPad = 14;
  const max = Math.max(...rows.flatMap(r => r.bars.map(b => b.v)));
  let y = 8, svg = "";
  rows.forEach(r => {
    const h = r.bars.length * (bh + gap);
    svg += `<text class="row-label" x="0" y="${y + h / 2 + 2}">${esc(r.label)}</text>`;
    r.bars.forEach((b, i) => {
      const w = Math.max(2, (b.v / max) * (W - left - right)), yy = y + i * (bh + gap);
      svg += `<rect x="${left}" y="${yy}" width="${w.toFixed(1)}" height="${bh}" rx="3" fill="${legend[i][1]}"/><text class="val" x="${(left + w + 8).toFixed(1)}" y="${yy + bh - 5}">${esc((fmt || (v => v))(b.v))}${b.note ? " (" + esc(b.note) + ")" : ""}</text>`;
    });
    y += h + rowPad;
  });
  const H = y;
  const table = `<table><caption class="sr-only">${esc(title)}</caption><thead><tr><th>Source</th>${legend.map(l => `<th>${esc(l[0])}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r.label)}</td>${r.bars.map(b => `<td>${esc((fmt || (v => v))(b.v))}${b.note ? " (" + esc(b.note) + ")" : ""}</td>`).join("")}</tr>`).join("")}</tbody></table>`;

}

/* The wave above the footer takes the colour of whatever section the page ends with */
function syncFooterWave(){
  const w = $("#footWave"), last = $("#app")?.lastElementChild; if (!w) return;
  let bg = "var(--paper)";
  try { const c = last && getComputedStyle(last).backgroundColor; if (c && c !== "transparent" && c !== "rgba(0, 0, 0, 0)") bg = c; } catch {}
  w.style.background = bg;
}
function updateNav(path){
  $$("#nav a[data-path]").forEach(a => { if (a.dataset.path === path || (path.startsWith("/insights") && a.dataset.path === "/insights")) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
}
function closeNav(){ $("#nav")?.classList.remove("open"); $("#navToggle")?.setAttribute("aria-expanded", "false"); }

/* ---------- Router ---------- */
function parseHash(){
  const h = location.hash.slice(1) || "/", [path, q] = h.split("?");
  return {path: path.startsWith("/") ? path : "/" + path, query: Object.fromEntries(new URLSearchParams(q || ""))};
}
function setView(html, title, mount, opts = {}){
  app().innerHTML = html;
  document.title = title ? `${title} – ${SITE.name}` : `${SITE.name}: ${SITE.tagline}`;
  if (!opts.keepScroll) window.scrollTo(0, 0);
  const h = $("h1", app()); if (h) { h.tabIndex = -1; h.focus({preventScroll:true}); }
  if (mount) mount();
  syncFooterWave();
}
function route(){
  const {path, query} = parseHash(); closeNav(); updateNav(path);
  if (path === "/" + ADMIN_PATH) return showAdmin();
  if (path.startsWith("/insights/")) { track("/insights"); return showInsight(path.slice(10)); }
  const page = SITE.pages[path];
  if (!page) { location.hash = "#/"; return; }
  const out = page({query});
  setView(out.html, out.title, out.mount, {keepScroll:!!query.s});
  track(path);
}
window.addEventListener("hashchange", route);

function renderBody(body){
  const blocks = String(body).replace(/\r/g, "").split(/\n{2,}/), out = [];
  blocks.forEach(b => {
    const lines = b.split("\n");
    if (/^## /.test(b)) { out.push(`<h3>${esc(b.replace(/^## /, "").trim())}</h3>`); return; }
    if (lines.every(l => /^- /.test(l))) { out.push(`<ul>${lines.map(l => `<li>${esc(l.replace(/^- /, ""))}</li>`).join("")}</ul>`); return; }
    out.push(`<p>${esc(b).replace(/\n/g, "<br>")}</p>`);
  });
  return out.join("");
}

/* ---------- Forms: contact, subscribe, chat (delegated) ---------- */
document.addEventListener("submit", async e => {
  const f = e.target;
  if (f.id === "contactForm") {
    e.preventDefault();
    const err = $("#c-err"), btn = $("#c-send"); err.textContent = "";
    if ($("#c-web").value) return;
    const topic = SITE.contactTopics.find(t => t.id === $("#c-topic").value), name = $("#c-name").value.trim(), email = $("#c-email").value.trim().toLowerCase();
    const org = $("#c-org").value.trim(), role = $("#c-role").value.trim(), msg = $("#c-msg").value.trim();
    if (name.length < 2) return err.textContent = "Enter your name.";
    if (!EMAIL_RE.test(email) || email.length > 254) return err.textContent = "Enter a valid email address so we can reply.";
    if (topic.org && org.length < 2) return err.textContent = "Enter your organisation for this kind of request.";
    if (msg.length < 10) return err.textContent = "Tell us a little more: at least 10 characters.";
    if (!$("#c-consent").checked) return err.textContent = "Tick the box to agree that we may contact you.";
    if (Date.now() - lastSend < 15000) return err.textContent = "Please wait a few seconds before sending again.";
    btn.disabled = true; btn.textContent = "Sending…";
    try {
      const row = {site:SITE.id, source:"form", topic:topic.label, name, email, organization:org || null, role:role || null, message:msg, consent:true};
      if (topic.nda) { row.address = $("#c-addr").value.trim() || null; row.signatory = $("#c-sign").value.trim() || null; }
      await api.sendInquiry(row);
      lastSend = Date.now();
      $("#contactForm").outerHTML = `<div class="panel" role="status"><h2 style="font-size:1.5rem;margin-bottom:.6rem">Thank you, ${esc(name.split(" ")[0])}</h2><p>We have your message and will reply to ${esc(email)}. ${esc(SITE.replyTime)}</p><p><a class="btn ghost" href="#/insights">Read our insights</a></p></div>`;
    } catch (ex) { console.error(ex); err.textContent = isLimited(ex) ? "You have sent several messages recently. Please try again later." : "We couldn't send your message. Check your connection and try again."; btn.disabled = false; btn.textContent = "Send message"; }
  }
  if (f.classList.contains("subscribe-form")) {
    e.preventDefault();
    const err = $(".sub-err", f); err.textContent = "";
    if ($(".hp", f).value) return;
    const email = $("input[type=email]", f).value.trim().toLowerCase();
    if (!EMAIL_RE.test(email) || email.length > 254) return err.textContent = "Enter a valid email address.";
    if (!$(".fs-consent", f).checked) return err.textContent = "Tick the box to agree to receive updates.";
    if (Date.now() - lastSub < 10000) return err.textContent = "Please wait a few seconds and try again.";
    const btn = $("button", f); btn.disabled = true;
    try { await api.subscribe({site:SITE.id, email, consent:true}); lastSub = Date.now(); f.reset(); toast("Thank you! You're subscribed.", "ok"); }
    catch (ex) { console.error(ex); err.textContent = isLimited(ex) ? "Too many sign-ups from this connection. Please try again later." : "We couldn't sign you up. Try again in a moment."; }
    finally { btn.disabled = false; }
  }
  if (f.id === "chatForm") {
    e.preventDefault();
    const err = $("#ch-err"), btn = $("#ch-send"); err.textContent = "";
    if ($("#ch-web").value) return;
    const q = $("#ch-text").value.trim(), email = $("#ch-email").value.trim().toLowerCase();
    if (q.length < 3) return err.textContent = "Type your question first.";
    if (email && (!EMAIL_RE.test(email) || email.length > 254)) return err.textContent = "That email address doesn't look right.";
    if (Date.now() - lastAsk < 10000) return err.textContent = "Please wait a few seconds before sending another question.";
    btn.disabled = true; btn.textContent = "Sending…";
    try {
      await api.sendInquiry({site:SITE.id, source:"chat", topic:"Chat question", name:null, email:email || null, message:q, consent:false});
      lastAsk = Date.now();
      const log = $("#chatLog");
      log.insertAdjacentHTML("beforeend", bubble("me", q) + bubble("bot", email ? `Thanks! We have your question and will reply to ${email}.` : "Thanks! We have your question. You didn't leave an email, so we can't reply directly. Add one next time if you'd like an answer."));
      log.scrollTop = log.scrollHeight; $("#ch-text").value = "";
    } catch (ex) { console.error(ex); err.textContent = isLimited(ex) ? "You have sent a lot of questions. Please try again later." : "We couldn't send that. Check your connection and try again."; }
    finally { btn.disabled = false; btn.textContent = "Send"; }
  }
});

/* ----- Inbox ----- */
async function showInbox(){
  const el = admLoading();
  try { state.inq = await api.inquiries(); renderInbox(); }

}
function inqFiltered(){
  const f = state.inqFilter, q = f.q.trim().toLowerCase();
  return state.inq.filter(i => (f.status === "All" || i.status === f.status) && (f.source === "All" || i.source === f.source) &&
    (!q || [i.name, i.email, i.organization, i.message, i.topic].join(" ").toLowerCase().includes(q)));
}
function renderInbox(){
  const f = state.inqFilter;
  $("#admBody").innerHTML = `<div class="afilters">
    <label class="sr-only" for="if-status">Status</label><select id="if-status">${["All", ...STATUSES].map(s => `<option ${s === f.status ? "selected" : ""}>${s}</option>`).join("")}</select>
    <label class="sr-only" for="if-source">Source</label><select id="if-source">${[["All", "All sources"], ["form", "Contact form"], ["chat", "Chat"]].map(([v, l]) => `<option value="${v}" ${v === f.source ? "selected" : ""}>${l}</option>`).join("")}</select>
    <label class="sr-only" for="if-q">Search</label><input id="if-q" type="search" placeholder="Search name, email, organisation or message" value="${esc(f.q)}"></div>
    <div class="arow-actions" style="margin-bottom:.8rem"><span class="muted" id="inqCount"></span><button class="btn ghost small" type="button" id="inqCsv">Download CSV</button></div>
    <div id="inqList" class="alist"></div>`;
  $("#if-status").addEventListener("change", e => { f.status = e.target.value; renderInqList(); });
  $("#if-source").addEventListener("change", e => { f.source = e.target.value; renderInqList(); });
  $("#if-q").addEventListener("input", e => { f.q = e.target.value; renderInqList(); });
  $("#inqCsv").addEventListener("click", () => downloadCsv("inquiries.csv", [["Received","Status","Source","Topic","Name","Email","Organisation","Role","Message","Notes"], ...inqFiltered().map(i => [i.created_at, i.status, i.source, i.topic, i.name, i.email, i.organization, i.role, i.message, i.admin_notes])]));

}

  }).join("") : `<div class="empty"><h3>No messages here</h3><p>${state.inq.length ? "Try changing the filters." : "Messages from the contact form and chat will appear here."}</p></div>`;

document.addEventListener("change", async e => {

document.addEventListener("click", async e => {
  if (!$("#admBody")) return;
  if (e.target.id === "newIns") { state.editing = {category:SITE.insightCats[0]}; renderInsightsAdmin(); $("#in-title")?.focus(); }
  if (e.target.id === "insCancel") { state.editing = null; renderInsightsAdmin(); }
  const b = e.target.closest("[data-ins]"); if (!b) return;
  const id = b.closest(".arow").dataset.id, i = state.ins.find(x => String(x.id) === id);
  if (b.dataset.ins === "edit") { state.editing = {...i}; renderInsightsAdmin(); $("#in-title")?.focus(); window.scrollTo({top:0, behavior:"smooth"}); }
  if (b.dataset.ins === "toggle") { const next = i.status === "Published" ? "Draft" : "Published"; try { await api.saveInsight({id, status:next}); toast(next === "Published" ? "Published." : "Moved back to drafts.", "ok"); showInsightsAdmin(); } catch (ex) { console.error(ex); toast("Couldn't change that article.", "error"); } }
  if (b.dataset.ins === "del") { if (!confirm("Delete this article permanently?")) return; try { await api.removeInsight(id); toast("Article deleted."); showInsightsAdmin(); } catch (ex) { console.error(ex); toast("Couldn't delete it.", "error"); } }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "insForm") return;
  e.preventDefault();
  const status = (e.submitter && e.submitter.dataset.status) || "Draft", err = $("#in-err"); err.textContent = "";
  const row = {title:$("#in-title").value.trim(), category:$("#in-cat").value, summary:$("#in-sum").value.trim(), body:$("#in-body").value.trim(), status};
  if (row.title.length < 3) return err.textContent = "Add a title.";
  if (row.summary.length < 3) return err.textContent = "Add a short summary.";
  if (row.body.length < 3) return err.textContent = "Write the article.";
  if (state.editing?.id) row.id = state.editing.id;
  try { await api.saveInsight(row); state.editing = null; toast(status === "Published" ? "Published." : "Saved as a draft.", "ok"); showInsightsAdmin(); }
  catch (ex) { console.error(ex); err.textContent = "Couldn't save. Make sure you ran thermo_setup.sql and are signed in as the administrator."; }
});

/* ----- Traffic ----- */
async function showTraffic(){
  const el = admLoading();
  try { renderTraffic(await api.traffic(state.days)); }
  catch (e) { console.error(e); el.innerHTML = `<div class="empty"><h3>Couldn't load traffic</h3><p>Make sure you ran thermo_setup.sql and are signed in as the administrator.</p></div>`; }
}
function renderTraffic(t){
  const days = state.days, map = Object.fromEntries((t.by_day || []).map(d => [String(d.day).slice(0, 10), Number(d.views)])), series = [];
  for (let i = days - 1; i >= 0; i--) { const d = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10); series.push([d, map[d] || 0]); }
  const max = Math.max(1, ...series.map(x => x[1]));
  const rank = (rows, label) => { const m = Math.max(1, ...rows.map(r => Number(r.views))); return rows.length ? `<div class="rank">${rows.map(r => `<div class="rank-row"><span>${esc(label(r))}</span><span class="rank-bar"><i style="width:${Number(r.views) / m * 100}%"></i></span><b>${Number(r.views)}</b></div>`).join("")}</div>` : `<p class="muted">No data yet.</p>`; };
  $("#admBody").innerHTML = `<div class="tabs" role="group" aria-label="Date range">${[7, 30, 90].map(n => `<button class="tab" type="button" data-days="${n}" aria-pressed="${days === n}">Last ${n} days</button>`).join("")}</div>
    <div class="stats"><div class="stat"><b>${Number(t.total_views || 0)}</b><span>Page views</span></div><div class="stat"><b>${Number(t.unique_visitors || 0)}</b><span>Visits (browser sessions)</span></div><div class="stat"><b>${Number(t.new_inquiries || 0)}</b><span>New messages</span></div><div class="stat"><b>${Number(t.subscribers || 0)}</b><span>Subscribers</span></div></div>
    <div class="panel" style="margin:.8rem 0"><h2 style="font-size:1.1rem;margin-bottom:.8rem">Page views per day</h2><div class="bars" role="img" aria-label="Bar chart of page views per day">${series.map(([d, v]) => `<i style="height:${Math.max(2, v / max * 100)}%" title="${d}: ${v} views"></i>`).join("")}</div></div>
    <div class="grid g2"><div class="panel"><h2 style="font-size:1.1rem;margin-bottom:.8rem">Most visited pages</h2>${rank(t.by_path || [], r => r.path === "/" ? "Home" : r.path)}</div><div class="panel"><h2 style="font-size:1.1rem;margin-bottom:.8rem">Where visitors came from</h2>${rank(t.by_referrer || [], r => r.ref)}</div></div>
    <p class="note" style="margin-top:1rem">Cookie-free: visits are counted per browser tab session and no IP addresses are stored. Your own visits are not counted while you are signed in as admin on this browser.</p>`;
}
document.addEventListener("click", e => { const b = e.target.closest("[data-days]"); if (b && $("#admBody")) { state.days = Number(b.dataset.days); showTraffic(); } });

/* ----- Documents: private templates (such as your NDA) and "Prepare document" ----- */
const VAR_LABELS = {effective_date:"Effective date", recipient_party:"Receiving party (person or organisation)", recipient_name:"Recipient name", recipient_first_name:"Recipient first name",
  recipient_address:"Receiving party address", recipient_signatory:"Receiving party signatory (name)", recipient_title:"Signatory title or affiliation",
  disclosing_address:"Your address for the agreement", disclosing_party:"Disclosing party", purpose:"Purpose of the discussions", term:"Agreement term", survival_term:"How long confidentiality continues",
  governing_law:"Governing law", sender_name:"Your name", sender_title:"Your title"};
const VAR_HINTS = {effective_date:"for example 15 October 2026", purpose:"keep it general: recipients read this before they sign", term:"for example three (3) years", survival_term:"for example five (5) years", governing_law:"choose one place, with your attorney", disclosing_address:"remembered on this device only"};
const todayLong = () => new Date().toLocaleDateString("en-GB", {day:"numeric", month:"long", year:"numeric"});
const tplVars = body => [...new Set([...String(body).matchAll(/\{\{\s*([a-z_]+)\s*\}\}/g)].map(m => m[1]))];
const fillTpl = (body, vals) => String(body).replace(/\{\{\s*([a-z_]+)\s*\}\}/g, (_, k) => { const v = String(vals[k] ?? "").trim(); return v || `[${(VAR_LABELS[k] || k.replace(/_/g, " ")).toLowerCase()}]`; });
const isEmailTpl = body => /^Subject:/i.test(String(body).trim());
function docHtml(text){
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  return String(text).replace(/\r/g, "").split(/\n{2,}/).map(b => {
    const lines = b.split("\n");
    if (/^# /.test(b)) return `<h3>${inline(b.replace(/^# /, ""))}</h3>`;
    if (lines.every(l => /^- /.test(l))) return `<ul>${lines.map(l => `<li>${inline(l.slice(2))}</li>`).join("")}</ul>`;
    return `<p>${lines.map(inline).join("<br>")}</p>`;
  }).join("");
}
function docDefaults(inq){
  return {effective_date:todayLong(), recipient_party:inq.organization || inq.name || "", recipient_name:inq.name || "", recipient_first_name:(inq.name || "").split(" ")[0],
    recipient_address:inq.address || "", recipient_signatory:inq.signatory || inq.name || "", recipient_title:inq.role || "", disclosing_address:store.get("nda_addr", ""),
    disclosing_party:"", purpose:"the Disclosing Party's microbial biotechnology research and its potential applications in health solutions and the environment", term:"", survival_term:"", governing_law:"",
    sender_name:"Denver Jn. Baptiste", sender_title:"Co-Founder & CEO"};
}
let dm = null;
async function openDocModal(inqId){
  const inq = state.inq.find(x => String(x.id) === String(inqId)); if (!inq) return;
  let tpls; try { tpls = await api.templates(); } catch (e) { console.error(e); return toast("Couldn't load your documents. Did you run thermo_setup.sql?", "error"); }
  if (!tpls.length) return toast("You have no documents yet. Add one in the Documents tab.", "error");
  const pick = (/nda/i.test(inq.topic || "") ? tpls.find(t => t.key === "nda") : null) || tpls[0];
  dm = {inq, tpls, tpl:pick, vals:docDefaults(inq)}; renderDocModal();
}
function renderDocModal(){
  let m = $("#docModal"); if (!m) { m = document.createElement("div"); m.id = "docModal"; m.className = "modal"; document.body.appendChild(m); }
  const t = dm.tpl, vars = tplVars(t.body), email = isEmailTpl(t.body);
  m.hidden = false;
  m.innerHTML = `<div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="dm-title">
    <header><div><h2 id="dm-title">Prepare a document</h2><p class="muted" style="margin:0">For ${esc(dm.inq.name || "chat visitor")}${dm.inq.organization ? ", " + esc(dm.inq.organization) : ""}</p></div><button class="x dark" type="button" id="dmClose" aria-label="Close">&times;</button></header>
    <div class="modal-body"><div class="field"><label for="dm-tpl">Document</label><select id="dm-tpl">${dm.tpls.map(x => `<option value="${esc(x.id)}" ${x.id === t.id ? "selected" : ""}>${esc(x.title)}</option>`).join("")}</select></div>
      <div class="dm-grid"><div class="dm-fields">${vars.length ? vars.map(k => { const label = VAR_LABELS[k] || k.replace(/_/g, " "), hint = VAR_HINTS[k];
        return `<div class="field"><label for="dv-${k}">${esc(label)}${hint ? ` <span class="hint">(${esc(hint)})</span>` : ""}</label>${k === "purpose" ? `<textarea id="dv-${k}" data-var="${k}" rows="3">${esc(dm.vals[k] || "")}</textarea>` : `<input id="dv-${k}" data-var="${k}" value="${esc(dm.vals[k] || "")}" autocomplete="off">`}</div>`; }).join("") : `<p class="muted">This document has nothing to fill in.</p>`}</div>
        <div><div class="dm-warn" id="dm-warn" role="status"></div><div class="docpaper" id="dm-paper" tabindex="0" aria-label="Document preview"></div></div></div></div>
    <footer class="dm-actions">${email ? `<a class="btn" id="dmMail" target="_blank" rel="noopener noreferrer" href="#">Open in my email app</a>` : `<button class="btn" type="button" id="dmPrint">Print or save as PDF</button><button class="btn ghost" type="button" id="dmWord">Download for Word</button>`}
      <button class="btn ghost" type="button" id="dmCopy">Copy text</button>${/^nda/.test(t.key) && dm.inq.status !== "NDA sent" && dm.inq.status !== "NDA signed" ? `<button class="btn ghost" type="button" id="dmSent">Mark as "NDA sent"</button>` : ""}</footer></div>`;
  updateDocPreview(); $("#dm-tpl").focus();
}
function docMailHref(filled){
  const lines = filled.replace(/\r/g, "").split("\n"), subject = (lines.shift() || "").replace(/^Subject:\s*/i, ""), body = lines.join("\n").replace(/^\n+/, "");
  return `mailto:${encodeURIComponent(dm.inq.email || "")}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}
function updateDocPreview(){
  const t = dm.tpl, filled = fillTpl(t.body, dm.vals), email = isEmailTpl(t.body);
  $("#dm-paper").innerHTML = email ? `<pre class="docmail">${esc(filled)}</pre>` : docHtml(filled);
  const missing = tplVars(t.body).filter(k => !String(dm.vals[k] ?? "").trim());
  const w = $("#dm-warn"); w.className = "dm-warn " + (missing.length ? "bad" : "good");
  w.innerHTML = missing.length ? `<b>${missing.length} item${missing.length > 1 ? "s" : ""} still to fill in:</b> ${missing.map(k => esc(VAR_LABELS[k] || k)).join(", ")}. They show in [brackets] in the document.` : "All fields are filled in. Read the whole document once before you send it.";
  const mail = $("#dmMail"); if (mail) { if (dm.inq.email) mail.href = docMailHref(filled); else { mail.removeAttribute("href"); mail.setAttribute("aria-disabled", "true"); mail.textContent = "No email address for this person"; } }
}
function closeDocModal(){ const m = $("#docModal"); if (m) { m.hidden = true; m.innerHTML = ""; } dm = null; }
function downloadBlob(name, blob){
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.var; if (!k || !dm) return;

document.addEventListener("click", async e => {
  if (!$("#admBody")) return;
  if (e.target.id === "newTpl") { state.editingTpl = {}; renderDocs(); $("#tp-title")?.focus(); }
  if (e.target.id === "tplCancel") { state.editingTpl = null; renderDocs(); }
  const b = e.target.closest("[data-tpl]"); if (!b) return;
  const id = b.closest(".arow").dataset.id, t = (state.tpls || []).find(x => String(x.id) === id);
  if (b.dataset.tpl === "edit") { state.editingTpl = {...t}; renderDocs(); $("#tp-title")?.focus(); window.scrollTo({top:0, behavior:"smooth"}); }
  if (b.dataset.tpl === "del") { if (!confirm("Delete this document permanently?")) return; try { await api.removeTemplate(id); toast("Document deleted."); showDocs(); } catch (ex) { console.error(ex); toast("Couldn't delete it.", "error"); } }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "tplForm") return;
  e.preventDefault();
  const err = $("#tp-err"); err.textContent = "";
  const row = {title:$("#tp-title").value.trim(), key:$("#tp-key").value.trim().toLowerCase(), body:$("#tp-body").value.trim()};
  if (row.title.length < 3) return err.textContent = "Add a title.";
  if (!/^[a-z0-9-]{2,40}$/.test(row.key)) return err.textContent = "The short name can use only lowercase letters, numbers and hyphens (2 to 40 characters).";
  if (row.body.length < 3) return err.textContent = "Add the text of the document.";
  if (state.editingTpl?.id) row.id = state.editingTpl.id;
  try { await api.saveTemplate(row); state.editingTpl = null; toast("Document saved.", "ok"); showDocs(); }
  catch (ex) { console.error(ex); err.textContent = /duplicate|unique/i.test(String(ex?.message)) ? "You already have a document with that short name." : "Couldn't save. Make sure you ran the latest thermo_setup.sql and are signed in as the administrator."; }
});

/* ----- CSV ----- */
const csvCell = v => { let t = String(v ?? ""); if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; return '"' + t.replace(/"/g, '""') + '"'; };
function downloadCsv(name, rows){
  const blob = new Blob(["\ufeff" + rows.map(r => r.map(csvCell).join(",")).join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

      <div><h4>Realistic product paths</h4><ul>${p.paths.map(x => `<li>${esc(x)}</li>`).join("")}</ul><h4>A realistic view</h4><p>${esc(p.honest)}</p><h4>Next step</h4><p>${esc(p.next)}</p></div></div></div></article>`).join("")}
    <div class="callout" style="margin-top:2rem"><p><strong>Intellectual property.</strong> ${IP_STATUS} We protect discoveries before we discuss methods, so technical detail is shared only under a signed mutual NDA.</p>
      <p><a class="btn accent" href="#/contact?topic=nda">Request an NDA and partner access</a></p></div></div></section>`,
  mount(){ if (query.s) { const el = document.getElementById(query.s); if (el) { el.classList.add("hl"); el.scrollIntoView({behavior:"smooth", block:"start"}); } } }}),

"/projections": () => ({title:"Projections", html:`${pageHead("Projections", "What the numbers around our work look like, how we plan to get from concept to partners, and what could slow us down.")}
  <section class="section"><div class="wrap"><div class="callout"><p><strong>How to read this page.</strong> Market figures come from third-party reports, which disagree with each other, so we show ranges. Our roadmap and funding ranges are planning estimates set by management. None of this is a forecast or an offer. See the notes at the bottom.</p></div></div></section>
  <section class="section" style="padding-top:0"><div class="wrap"><div class="head"><h2>The need: drug-resistant infections</h2><p class="lede">Resistance is already a leading cause of death worldwide, and the projections point up.</p></div>
    ${chart({title:"Deaths directly caused by bacterial antimicrobial resistance each year (millions)", legend:[["2021", "#d9572b"], ["2050 forecast", "#0a4950"]], rows:[{label:"Worldwide, per year", bars:[{v:1.14, note:"2021"}, {v:1.91, note:"2050"}]}], fmt:v => v.toFixed(2) + " million", src:"Source: GBD 2021 Antimicrobial Resistance Collaborators, The Lancet, 16 September 2024 (doi:10.1016/S0140-6736(24)01867-1). The study forecasts more than 39 million cumulative deaths directly caused by resistance between 2025 and 2050, and estimates that new antibiotics aimed at hard-to-treat Gram-negative bacteria could avert about 11 million of them."})}</div></section>
  ${wave("var(--paper)", "var(--tint)")}<section class="section tint aw"><div class="wrap"><div class="head"><h2>The market: why the range is wide</h2><p class="lede">Reports define the plasmid DNA market differently, and they make different growth assumptions. Read the ranges, not any single number.</p></div>
    ${chart({title:"Plasmid DNA manufacturing market, plasmid only (US$ billion)", legend:[["Base year", "#c27b0b"], ["2033 projection", "#108f85"]], rows:[{label:"Grand View Research", bars:[{v:0.80, note:"2024"}, {v:5.04, note:"2033"}]}, {label:"Market.us", bars:[{v:1.19, note:"2023"}, {v:8.54, note:"2033"}]}], fmt:v => "$" + v.toFixed(2) + "B", src:"Sources: Grand View Research, Plasmid DNA Manufacturing Market, 2025 to 2033; Market.us, plasmid DNA manufacturing market release, February 2026."})}
    ${chart({title:"Viral vector and plasmid DNA manufacturing combined (US$ billion)", legend:[["Base year", "#c27b0b"], ["2033 projection", "#108f85"]], rows:[{label:"Astute Analytica", bars:[{v:4.21, note:"2024"}, {v:20.30, note:"2033"}]}, {label:"Allied Market Research", bars:[{v:5.3, note:"2023"}, {v:34.0, note:"2033"}]}], fmt:v => "$" + v.toFixed(1) + "B", src:"Sources: Astute Analytica, release of 25 August 2025; Allied Market Research, Viral Vectors and Plasmid DNA Manufacturing Market, 2024 to 2033. Other reports put the combined market anywhere between roughly $15 billion and $39 billion by 2033."})}
    <div class="callout"><p><strong>What this means for ThermoGenBio.</strong> Most of this demand is for defined, manufacturing-grade plasmids made in standard production hosts. We do not plan to sell raw natural plasmids into that market. Our opportunity is upstream: new genetic parts, enzymes, curated data and discovery partnerships that manufacturers and drug developers can build on.</p></div></div></section>
  ${wave("var(--tint)", "var(--paper)")}<section class="section aw"><div class="wrap"><div class="head"><h2>Our roadmap: four stages with decision gates</h2><p class="lede">We commit to the next stage only when the last one has earned it. Ranges are indicative planning estimates, set in October 2026.</p></div>
    <ol class="road">
      <li><div class="when">Months 0 to 6<small>Foundation</small></div><div class="what"><h3>Get set up properly</h3><p class="need">Indicative need: US$25,000 to US$75,000</p><ul><li>Access and permitting arrangements agreed with the relevant authorities</li><li>Biosafety and record-keeping systems in place</li><li>Intellectual property advice taken before any public disclosure</li><li>Pilot sampling plan agreed with a regional laboratory partner</li></ul><p class="gate">Gate: go to the pilot only if permits, a partner and funding are in place.</p></div></li>
      <li><div class="when">Months 6 to 18<small>Pilot and proof of concept</small></div><div class="what"><h3>Generate the first real data</h3><p class="need">Indicative need: US$100,000 to US$300,000</p><ul><li>First sampling and characterisation completed</li><li>A documented data package for each program</li><li>First conversations with partners, under NDA</li></ul><p class="gate">Gate: continue only if the data supports a next step in at least one program.</p></div></li>
      <li><div class="when">Months 18 to 30<small>Validation and partnerships</small></div><div class="what"><h3>Let others test it</h3><p class="need">Indicative need: US$300,000 to US$1 million</p><ul><li>Independent validation of the leading results</li><li>Sponsored research or collaboration agreements</li><li>A plan for publishing, timed with intellectual property protection</li></ul><p class="gate">Gate: continue only if a partner commits resources.</p></div></li>
      <li><div class="when">Months 30 to 48<small>Licensing and scale</small></div><div class="what"><h3>Turn results into agreements</h3><p class="need">Indicative need: US$1 million to US$3 million or more, partly partner and follow-on funded</p><ul><li>Licence or option agreements on validated candidates</li><li>A small data or service offering for research customers</li><li>Regional training and laboratory partnerships</li></ul></div></li></ol></div></section>
  <section class="section tint"><div class="wrap"><div class="head"><h2>Where this could land after about three years</h2><p class="lede">Outcomes, not revenue promises. These scenarios depend on funding, results and partners.</p></div>
    <div class="grid g3"><div class="scen s-c"><h3>Conservative</h3><ul><li>Intellectual property filed and a documented data collection built</li><li>One or two academic collaborations</li><li>Funded mostly by grants</li></ul></div>
      <div class="scen s-b"><h3>Base case</h3><ul><li>Everything in the conservative case</li><li>A sponsored research or collaboration agreement with an industry partner</li><li>Validated early results in at least one program</li><li>Follow-on funding secured</li></ul></div>
      <div class="scen s-u"><h3>Upside</h3><ul><li>Everything in the base case</li><li>An option or licence agreement with a biotech or pharma partner</li><li>A regional training and laboratory partnership</li></ul></div></div></div></section>
  <section class="section"><div class="wrap split"><div><h2>What could slow us down</h2><ul>
      <li><b>Hard-to-grow organisms.</b> Many extremophiles are difficult to culture, so some work will rely on sequencing, which costs more.</li>
      <li><b>Biosafety and regulation.</b> Natural genetic material can carry unwanted traits, including antibiotic resistance, and must be handled under strict rules.</li>
      <li><b>Long timelines.</b> Health solutions take a decade or more, and most candidates fail.</li>
      <li><b>Access and benefit-sharing.</b> Permits and agreements with host countries take time to negotiate properly.</li>
      <li><b>Funding.</b> Each stage depends on raising the next.</li></ul></div>
    <div class="panel"><h2 style="font-size:1.3rem;margin-bottom:.6rem">Notes and sources</h2><p class="note">Projections and forward-looking statements are estimates and may differ materially from outcomes. Nothing here is investment advice or an offer to sell securities. Market figures are third-party estimates that vary widely by definition and method. Funding ranges are management planning estimates, not quotes.</p>
      <p class="note"><b>Sources:</b> GBD 2021 Antimicrobial Resistance Collaborators (The Lancet, 2024); Grand View Research; Market.us; Astute Analytica; Allied Market Research.</p>
      <p><a class="btn accent" href="#/contact?topic=funding">Talk to us about funding</a></p></div></div></section>`}),

"/founders": () => foundersPage(),

"/about": () => ({title:"About", html:`${pageHead("About ThermoGenBio", "An early-stage research and development company working where the science is still mostly unexplored.")}
  <section class="section"><div class="wrap split"><div><h2>Why we exist</h2><p>Caribbean geothermal springs host microbial communities adapted to heat, acidity and mineral-rich water. Published surveys are limited, and the commercial development of what these microbes contain has barely begun.</p>
      <p>ThermoGenBio exists to study these communities responsibly and to turn what we learn into tools, data and partnerships that benefit science and the region.</p>
      <h2 style="margin-top:2rem">What we do</h2><p>We run three programs: genetic resources and tools, antimicrobial discovery, and environmental biotechnology. They are described on the <a href="#/programs">Programs page</a>, and the plan to get from concept to partners is on the <a href="#/projections">Projections page</a>.</p></div>
    <div class="grid" style="gap:1rem">
      <div class="card"><h3>Ask first</h3><p>We work only with permission from the relevant authorities and landowners.</p></div>
      <div class="card c2"><h3>Share the benefits</h3><p>Where our work creates value, we aim to share it fairly with host communities and institutions.</p></div>
      <div class="card c3"><h3>Document everything</h3><p>Clear, dated records show where material came from and under what terms.</p></div>
      <div class="card c4"><h3>Put biosafety first</h3><p>We handle biological material under strict safety and regulatory rules.</p></div></div></div></section>
  <section class="section tint"><div class="wrap split"><div><h2>How we protect our work</h2><p>${IP_STATUS} We protect discoveries before we discuss methods, which is why our organisms, methods and data are not published here. Partners receive technical detail under a signed mutual NDA before any substantive discussion.</p></div>
    <div><h2>The ThermoDen family</h2><p>ThermoGenBio is the research and development company. <a href="${esc(THERMODEN_URL)}" target="_blank" rel="noopener noreferrer">ThermoDen</a> is our consulting company, which helps research teams with study design, laboratory systems, proposals and training. The two companies share founders but run separately, with separate websites and separate aims.</p>
      <div class="actions"><a class="btn ghost" href="${esc(THERMODEN_URL)}" target="_blank" rel="noopener noreferrer">Visit ThermoDen <span class="sr-only">(opens in a new tab)</span>&#8599;</a></div></div></div></section>`}),

"/insights": () => insightsPage(),
