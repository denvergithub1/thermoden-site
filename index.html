<style>
/* ---------- Tokens: one structure, two palettes ---------- */
:root{
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ink:#14211f; --field:#6f8079; --muted:#51635e; --line:#d3dcd7; --card:#ffffff; --danger:#a1342b; --ok:#1d6b62;
  --sand:#d8cba1; --gold:#c2a836; --s1:#d8cba1; --s2:#c2a836; --s3:#9a4529; --s4:#1d6b62; --s5:#123f3a;
  color-scheme:light;
}
html[data-site="thermogen"]{--deep:#123f3a; --paper:#f2f5f2; --a1:#9a4529; --a2:#1d6b62; --a3:#7a6618; --tint:#e6ece8; --on-deep:#d4e4de;}
html[data-site="thermoden"]{--deep:#172a3f; --paper:#f3f5f6; --a1:#a0612a; --a2:#1d6b62; --a3:#7a6618; --tint:#e7ecef; --on-deep:#d3deea;
  --s1:#e0d5b6; --s2:#c2a836; --s3:#a0612a; --s4:#1d6b62; --s5:#172a3f;}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font:400 1.0625rem/1.65 var(--sans);color:var(--ink);background:var(--paper);min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
img,svg{max-width:100%}
a{color:var(--a2)}
a:hover{color:var(--deep)}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.15;margin:0;color:var(--deep);text-wrap:balance}
h1{font-size:clamp(2.15rem,4.7vw,3.5rem);letter-spacing:-.015em}
h2{font-size:clamp(1.65rem,3vw,2.25rem);letter-spacing:-.01em}
h3{font-size:1.3rem}
h4{font-size:1.1rem}
p{margin:0 0 1em;max-width:68ch}
ul,ol{margin:0 0 1em;padding-left:1.25rem}
li{margin:.3em 0}
small{font-size:.88em}
:focus-visible{outline:3px solid var(--a1);outline-offset:3px;border-radius:4px}
.site-header :focus-visible,.site-footer :focus-visible,.section.dark :focus-visible,.hero:not(.light) :focus-visible,.chat-panel header :focus-visible,.core-detail :focus-visible{outline-color:#fff}
h1:focus,h1:focus-visible{outline:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;-webkit-user-select:none;user-select:none}
.skip{position:absolute;left:.75rem;top:-4rem;background:#fff;color:var(--deep);padding:.6rem .9rem;border-radius:8px;z-index:200;font-weight:600}
.skip:focus{top:.75rem}
[hidden]{display:none!important}
.wrap{width:min(1120px,100% - 2.5rem);margin-inline:auto}
.narrow{max-width:760px}
.section{padding:clamp(2.6rem,6vw,4.6rem) 0}
.section.tint{background:var(--tint)}
.section.dark{background:var(--deep);color:var(--on-deep)}
.section.dark h2,.section.dark h3,.section.dark h4{color:#fff}
.section.dark a{color:#fff}
.lede{font-size:1.18rem;color:var(--muted);max-width:62ch}
.dark .lede{color:var(--on-deep)}
.head{margin-bottom:2rem}
.head h2{margin-bottom:.7rem}
.muted{color:var(--muted)}
.note{font-size:.93rem;color:var(--muted)}

/* ---------- Header ---------- */
.site-header{background:var(--deep);position:sticky;top:0;z-index:50}
.site-header .wrap{display:flex;align-items:center;gap:1rem;min-height:64px}
.brand{display:flex;align-items:center;gap:.65rem;color:#fff;text-decoration:none;font:600 1.3rem/1 var(--serif);letter-spacing:-.01em}
.brand:hover{color:#fff}
.brand svg{width:129px;height:46px;flex:none;display:block}
@media(max-width:420px){.brand svg{width:108px;height:39px}}
.nav{margin-left:auto;display:flex;align-items:center;gap:.15rem}
.nav a{color:var(--on-deep);text-decoration:none;font-weight:500;font-size:.96rem;padding:.55rem .75rem;border-radius:8px}
.nav a:hover{color:#fff;background:rgba(255,255,255,.1)}
.nav a[aria-current="page"]{color:#fff;box-shadow:inset 0 -3px 0 var(--gold);border-radius:8px 8px 0 0}
.nav .ext{border:1.5px solid rgba(255,255,255,.35);margin-left:.4rem}
.nav .ext:hover{border-color:#fff}
.nav-toggle{display:none;margin-left:auto;background:none;border:1.5px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:.45rem .7rem;font:600 .95rem var(--sans);cursor:pointer}
@media(max-width:860px){
  .nav-toggle{display:inline-block}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--deep);flex-direction:column;align-items:stretch;padding:.5rem 1.25rem 1rem;border-top:1px solid rgba(255,255,255,.15)}
  .nav.open{display:flex}
  .nav a{padding:.8rem .5rem;border-radius:6px}
  .nav a[aria-current="page"]{box-shadow:inset 4px 0 0 var(--gold);border-radius:6px}
  .nav .ext{margin:.4rem 0 0;text-align:center}
}

/* ---------- Buttons and forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font:600 1rem/1 var(--sans);padding:.95rem 1.35rem;border-radius:10px;border:2px solid transparent;cursor:pointer;text-decoration:none;background:var(--deep);color:#fff;min-height:48px;transition:background .15s}
.btn:hover{background:var(--a2);color:#fff}
.btn.accent{background:var(--a1)}
.btn.accent:hover{background:#7e3720}
html[data-site="thermoden"] .btn.accent:hover{background:#824d1f}
.btn.ghost{background:transparent;color:var(--deep);border-color:var(--deep)}
.btn.ghost:hover{background:var(--deep);color:#fff}
.dark .btn.ghost{color:#fff;border-color:rgba(255,255,255,.6)}
.dark .btn.ghost:hover{background:#fff;color:var(--deep)}
.btn.small{min-height:40px;padding:.6rem .95rem;font-size:.92rem}
.btn.danger{background:transparent;color:var(--danger);border-color:#e4bdb8}
.btn.danger:hover{background:#fbeceb;color:var(--danger)}
.btn[disabled]{opacity:.6;cursor:progress}
.actions{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.4rem}
.f{display:grid;gap:1.05rem}
.field label,.field .lbl{display:block;font-weight:600;font-size:.95rem;margin-bottom:.35rem}
.field .hint{font-weight:400;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;font:400 1rem/1.4 var(--sans);padding:.8rem .9rem;border-radius:8px;border:1.5px solid var(--field);background:#fff;color:var(--ink);min-height:48px}
.field textarea{min-height:130px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--a2);outline:3px solid rgba(29,107,98,.25)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:600px){.row2{grid-template-columns:1fr}}
.check{display:flex;gap:.65rem;align-items:flex-start;font-size:.95rem}
.check input{width:1.15rem;height:1.15rem;margin-top:.2rem;accent-color:var(--a2);flex:none}
.err{color:var(--danger);font-weight:600;font-size:.93rem;min-height:1.2em;margin:0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.4rem 1.5rem}
.callout{border-left:5px solid var(--gold);background:#fff;padding:1rem 1.2rem;border-radius:0 10px 10px 0}
.callout p:last-child{margin-bottom:0}

/* ---------- Strata (the core-sample motif) ---------- */
.strata{display:block;height:44px;background-repeat:repeat-x;background-size:240px 44px;background-position:0 0}
.strata.thin{height:22px;background-size:120px 22px}
@media (prefers-reduced-motion:no-preference){
  .strata{animation:tide 22s linear infinite}
  .strata.thin{animation-name:tidethin}
}
@keyframes tide{to{background-position-x:240px}}
@keyframes tidethin{to{background-position-x:120px}}

/* ---------- Home heroes ---------- */
.hero{background:var(--deep);color:var(--on-deep);padding:clamp(2.6rem,6vw,4.4rem) 0 clamp(2.6rem,6vw,4rem)}
.hero h1{color:#fff;max-width:17ch}
.hero .lede{color:var(--on-deep);margin:1.1rem 0 0}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(1.5rem,4vw,3.5rem);align-items:center}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr}}
.hero .btn.ghost{color:#fff;border-color:rgba(255,255,255,.6)}
.hero .btn.ghost:hover{background:#fff;color:var(--deep)}
.hero.light{background:var(--paper);color:var(--ink);padding-bottom:0}
.hero.light h1{color:var(--deep);max-width:21ch}
.hero.light .lede{color:var(--muted)}
.hero.light .btn.ghost{color:var(--deep);border-color:var(--deep)}
.hero.light .btn.ghost:hover{background:var(--deep);color:#fff}

/* ThermoGen: interactive core log */
.corelog{display:grid;grid-template-columns:2.4rem 1fr;gap:.6rem;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:1rem}
.ticks{display:flex;flex-direction:column;justify-content:space-between;font-size:.78rem;color:var(--on-deep);padding:.3rem 0;text-align:right}
.core{display:flex;flex-direction:column;gap:3px;height:340px}
.layer{flex:1;border:0;border-radius:6px;cursor:pointer;text-align:left;padding:0 1rem;font:600 .98rem/1.2 var(--sans);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:.5rem;transition:flex .35s ease,filter .2s;position:relative;overflow:hidden}
.layer:hover{filter:brightness(1.08)}
.layer[aria-pressed="true"]{flex:2.1;box-shadow:inset 0 0 0 3px #fff}
.layer .tag{font-weight:500;font-size:.82rem;opacity:.92}
.layer.l1{background:repeating-linear-gradient(90deg,#d8cba1 0 9px,#cbbd8f 9px 11px);color:#241f10}
.layer.l2{background:repeating-linear-gradient(90deg,#9a4529 0 14px,#8a3b22 14px 17px)}
.layer.l3{background:repeating-linear-gradient(90deg,#7a6618 0 11px,#6b5814 11px 14px)}
.layer.l4{background:repeating-linear-gradient(90deg,#1d6b62 0 12px,#175a52 12px 15px)}
.layer.l5{background:repeating-linear-gradient(90deg,#0d332f 0 16px,#0a2926 16px 19px)}
.core-detail{grid-column:1 / -1;margin-top:.7rem;background:rgba(0,0,0,.22);border-radius:10px;padding:1rem 1.1rem;color:#fff}
.core-detail h3{color:#fff;font-size:1.15rem;margin-bottom:.3rem}
.core-detail p{margin:0 0 .6rem;font-size:.98rem;color:var(--on-deep)}
.core-detail a{color:#fff;font-weight:600}
@media(prefers-reduced-motion:reduce){.layer{transition:none}}
@media(max-width:600px){.core{height:300px}}

/* ThermoDen: service finder */
.finder{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1.3rem 1.4rem;color:var(--ink)}
.finder h2{font-size:1.35rem;margin-bottom:.8rem;color:var(--deep)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{font:600 .93rem var(--sans);padding:.6rem .95rem;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;min-height:44px}
.chip:hover{border-color:var(--a2)}
.chip[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
.finder-result{margin-top:1rem;background:var(--tint);border-radius:10px;padding:1rem 1.1rem}
.finder-result h3{margin-bottom:.35rem;font-size:1.15rem}
.finder-result p{margin:0 0 .8rem;font-size:.98rem}

/* ---------- Grids and cards ---------- */
.grid{display:grid;gap:1.25rem}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--a1);border-radius:6px 6px 12px 12px;padding:1.3rem 1.35rem}
.card.c2{border-top-color:var(--s2)}.card.c3{border-top-color:var(--a2)}.card.c4{border-top-color:var(--deep)}
.card h3,.card h4{margin-bottom:.5rem}
.card p:last-child{margin-bottom:0}
.tagline{display:inline-block;font-weight:600;font-size:.88rem;padding:.2rem .65rem;border-radius:99px;background:var(--tint);color:var(--deep);margin-bottom:.7rem}
.stage{font-size:.9rem;color:var(--a3);font-weight:600}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.fact{padding:1.3rem 1.4rem;border-right:1px solid var(--line)}
.fact:last-child{border-right:0}
.fact b{display:block;font:600 1.9rem/1.1 var(--serif);color:var(--deep);margin-bottom:.4rem;font-variant-numeric:tabular-nums}
.fact p{margin:0;font-size:.95rem;color:var(--muted)}
.fact small{display:block;margin-top:.4rem;color:var(--muted)}
@media(max-width:760px){.facts{grid-template-columns:1fr}.fact{border-right:0;border-bottom:1px solid var(--line)}.fact:last-child{border-bottom:0}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.5rem,4vw,3rem);align-items:start}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.list-plain{list-style:none;padding:0}
.list-plain li{padding:.5rem 0;border-bottom:1px solid var(--line)}
.list-plain li:last-child{border-bottom:0}

/* Services (ThermoDen) */
.service{display:grid;grid-template-columns:3.2rem 1fr;gap:1rem;padding:1.4rem 0;border-top:1px solid var(--line)}
.service:target,.service.hl{background:linear-gradient(90deg,rgba(194,168,54,.16),transparent 70%)}
.service .ico{width:3.2rem;height:3.2rem;border-radius:10px;background:var(--deep);color:#fff;display:grid;place-items:center}
.service .ico svg{width:1.6rem;height:1.6rem}
.service h3{margin-bottom:.3rem}
.service h4{font-family:var(--sans);font-size:.95rem;margin:.9rem 0 .25rem}
.service ul{margin-bottom:.3rem}
.mini{display:grid;grid-template-columns:2.6rem 1fr;gap:.9rem;align-items:start}
.mini .ico{width:2.6rem;height:2.6rem;border-radius:9px;background:var(--deep);color:#fff;display:grid;place-items:center}
.mini .ico svg{width:1.35rem;height:1.35rem}

/* Process steps (a real sequence) */
.steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.25rem;counter-reset:step}
@media(max-width:900px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.steps{grid-template-columns:1fr}}
.steps li{counter-increment:step;margin:0;padding:1.1rem 1.15rem 1.2rem;background:#fff;border:1px solid var(--line);border-radius:10px;position:relative}
.steps li::before{content:counter(step);display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--deep);color:#fff;font:700 .95rem var(--sans);margin-bottom:.6rem}
.steps h4{margin-bottom:.3rem}
.steps p{margin:0;font-size:.95rem;color:var(--muted)}

/* Roadmap (ThermoGen projections) */
.road{list-style:none;padding:0;display:grid;gap:0;position:relative;margin:0}
.road > li{display:grid;grid-template-columns:8.5rem 1fr;gap:1.4rem;margin:0;padding:0 0 1.6rem;position:relative}
.road > li::before{content:"";position:absolute;left:8.5rem;margin-left:.65rem;top:.4rem;bottom:-.4rem;width:3px;background:linear-gradient(var(--s3),var(--s4))}
.road > li:last-child::before{display:none}
.road .when{font:600 1rem var(--serif);color:var(--deep);text-align:right;padding-right:1.5rem;position:relative}
.road .when::after{content:"";position:absolute;right:-.05rem;top:.35rem;width:14px;height:14px;border-radius:50%;background:var(--a1);border:3px solid var(--paper);box-shadow:0 0 0 2px var(--a1);transform:translateX(50%)}
.road .when small{display:block;font:400 .85rem var(--sans);color:var(--muted)}
.road .what{background:#fff;border:1px solid var(--line);border-radius:10px;padding:1rem 1.2rem;margin-left:1rem}
.road .what h3{font-size:1.15rem;margin-bottom:.3rem}
.road .what .need{font-weight:600;color:var(--a3);font-size:.93rem;margin-bottom:.4rem}
.road .what ul{margin:.3rem 0 .5rem}
.road .gate{font-size:.92rem;color:var(--muted);margin:0}
@media(max-width:700px){
  .road > li{grid-template-columns:1fr;gap:.3rem;padding-left:1.8rem}
  .road > li::before{left:.35rem;margin-left:0}
  .road .when{text-align:left;padding-right:0}
  .road .when::after{left:-1.8rem;right:auto;top:.3rem;transform:translateX(-1px)}
  .road .what{margin-left:0}
}

/* Charts */
.chart{margin:0 0 2rem;background:#fff;border:1px solid var(--line);border-radius:12px;padding:1.2rem 1.3rem}
.chart figcaption{font:600 1.05rem var(--serif);color:var(--deep);margin-bottom:.8rem}
.chart svg{width:100%;height:auto;display:block}
.chart .row-label{font:500 13px var(--sans);fill:var(--ink)}
.chart .val{font:600 13px var(--sans);fill:var(--ink)}
.chart .axis{stroke:var(--line)}
.chart details{margin-top:.8rem;font-size:.92rem}
.chart summary{cursor:pointer;font-weight:600;color:var(--a2)}
.chart table{border-collapse:collapse;width:100%;margin-top:.6rem}
.chart th,.chart td{padding:.4rem .6rem;border-bottom:1px solid var(--line);text-align:left;font-size:.92rem}
.chart .src{margin:.8rem 0 0;font-size:.85rem;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;margin:.2rem 0 .8rem;font-size:.9rem}
.legend span::before{content:"";display:inline-block;width:.8rem;height:.8rem;border-radius:3px;margin-right:.4rem;background:var(--c);vertical-align:-1px}

/* Scenarios */
.scen{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.scen h3{padding:.9rem 1.2rem;color:#fff;font-size:1.1rem}
.scen.s-c h3{background:var(--a2)}.scen.s-b h3{background:var(--deep)}.scen.s-u h3{background:var(--a1)}
.scen ul{padding:1rem 1.2rem 1rem 2.4rem;margin:0}

/* Founders */
.founder{display:grid;grid-template-columns:minmax(0,12.5rem) 1fr;gap:clamp(1.5rem,4vw,3rem);padding:2.4rem 0;border-top:1px solid var(--line)}
.founder:first-of-type{border-top:0;padding-top:0}
@media(max-width:820px){.founder{grid-template-columns:1fr}}
.avatar{width:100%;max-width:12.5rem;aspect-ratio:1/1;border-radius:12px;display:grid;place-items:center;color:#fff;font:600 4rem var(--serif);background:var(--deep);position:relative;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar .band{position:absolute;left:0;right:0;bottom:0;height:12px;display:flex}
.avatar .band i{flex:1}

<script>
"use strict";
/* =====================================================================
   SETTINGS: edit these before you launch (this block is at the top of the script)
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: "",            // Supabase dashboard > Project Settings > API > Project URL
  SUPABASE_ANON_KEY: ""   // the "anon public" key (never the service_role key)
};
const THERMODEN_URL = "https://www.thermoden.com";        // where the ThermoDen site will live 
const THERMOGEN_URL = "https://www.thermogen.bio"; // where the ThermoGen site will live 
const LABNINJA_URL = "https://www.labninja.ai";          // companies that ThermoDen sponsors and advises: their websites
const ISLECONNECT_URL = "https://isleconnect.co";
const ISLERIDE_URL = "https://isleride.online";
const ADMIN_PATH = "den-k7q2";                       // secret word for the admin sign-in page: yoursite/#/<this word>
const SITE_OPERATOR = "ThermoDen";       // shown on the Privacy and Terms pages
const CONTACT_EMAIL = "jsurvey758@gmail.com";           // shown on the Privacy and Terms pages
const LEGAL_UPDATED = "14 October 2026";
const PATENT_FILED = false;   // set to true ONLY after a patent application has actually been filed. Until then the site must not say "patent pending".
const PHOTO_DENVER = "team/denver.jpg";   // the photo file in the team folder next to index.html. Replace the file (keep the name) to change the picture.
const PHOTO_JAMILLE = "team/jamille.jpg"; // set to "" to show initials instead
 
const MIN_RATING_NOTE = "";   // (unused)

/* Security & privacy switches */
const BLOCK_FRAMING = true;   // never show this site inside another site's frame

/* =====================================================================
   ENGINE: shared by both sites. Security, data, routing, forms, chat, charts.
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch { return ""; } };
const store = {
  get(k, d){ try { const v = localStorage.getItem("th_" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem("th_" + k, JSON.stringify(v)); } catch {} }
};
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const isLimited = ex => /rate_limited/.test(String((ex && (ex.message || ex.hint)) || ""));
const fmtDate = d => new Date(d).toLocaleDateString(undefined, {year:"numeric", month:"long", day:"numeric"});
const rtf = new Intl.RelativeTimeFormat(undefined, {numeric:"auto"});
function ago(iso){
  const s = (new Date(iso) - Date.now()) / 1000, a = Math.abs(s);
  if (a < 60) return "just now";
  if (a < 3600) return rtf.format(Math.round(s / 60), "minute");
  if (a < 86400) return rtf.format(Math.round(s / 3600), "hour");
  if (a < 2592000) return rtf.format(Math.round(s / 86400), "day");
  return fmtDate(iso);
}
function toast(msg, type = ""){
  const t = document.createElement("div"); t.className = "toast " + type; t.textContent = msg;
  $("#toasts").appendChild(t); setTimeout(() => t.remove(), 5500);
}

/* ---------- Security: frame guard, safe database connection, no cookies ---------- */
try { if (BLOCK_FRAMING && window.top !== window.self) document.documentElement.style.display = "none"; }
catch { document.documentElement.style.display = "none"; }
const validUrl = u => { try { const x = new URL(u); return x.protocol === "https:" && !x.hostname.includes(".."); } catch { return false; } };
let sb = null;
try {
  if (window.supabase && validUrl(CONFIG.SUPABASE_URL) && CONFIG.SUPABASE_ANON_KEY && !/^YOUR_/.test(CONFIG.SUPABASE_ANON_KEY)) {
    sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  }
} catch (err) { console.error("Supabase setup failed:", err); sb = null; }
const DEMO = !sb;
const LIB_BLOCKED = !window.supabase && validUrl(CONFIG.SUPABASE_URL);

/* ---------- Data layer (Supabase, with an in-memory demo fallback) ---------- */
const daysAgo = d => new Date(Date.now() - d * 864e5).toISOString();
const demoDb = {
  inquiries: [
    {id:"i1", site:"thermoden", source:"form", topic:"Book an introductory call", name:"Alex Morgan", email:"alex@example.org", organization:"Island University", role:"Dean of Sciences", message:"We would like to talk about a partnership.\nCould we set up a call next week?", consent:true, status:"New", admin_notes:"", created_at:daysAgo(0.4)},
    {id:"i2", site:"thermoden", source:"chat", topic:"Chat question", name:null, email:"visitor@example.org", organization:null, role:null, message:"Do you work with small research teams?", consent:false, status:"In discussion", admin_notes:"Replied on Monday.", created_at:daysAgo(2)}
  ],
  insights: [
    {id:"n1", site:"thermoden", title:"Welcome to our Insights", category:"Company news", summary:"What you will find here and how often we publish.", body:"This is a sample article that shows how Insights look.\n\n## What to expect\n\n- Plain-language explainers\n- Company news\n- Practical guidance", status:"Published", published_at:daysAgo(5), created_at:daysAgo(5)},
    {id:"n2", site:"thermoden", title:"A draft you have not published yet", category:"Company news", summary:"Only you can see drafts.", body:"Drafts stay private until you publish them.", status:"Draft", published_at:null, created_at:daysAgo(1)}
  ],
  subs: [{id:"s1", site:"thermoden", email:"reader@example.org", consent:true, created_at:daysAgo(3)}]
};
const api = {
  async insights(){
    if (DEMO) return demoDb.insights.filter(i => i.status === "Published").sort((a, b) => b.published_at.localeCompare(a.published_at));
    const {data, error} = await sb.from("insights").select("id,title,category,summary,published_at").eq("site", SITE.id).eq("status", "Published").order("published_at", {ascending:false}).limit(100);
    if (error) throw error; return data;
  },
  async insight(id){
    if (DEMO) return demoDb.insights.find(i => i.id === id && i.status === "Published") || null;
    const {data, error} = await sb.from("insights").select("*").eq("site", SITE.id).eq("id", id).eq("status", "Published").maybeSingle();
    if (error) throw error; return data;
  },
  async sendInquiry(row){
    if (DEMO) { demoDb.inquiries.unshift({...row, id:"i" + Date.now(), status:"New", admin_notes:"", created_at:new Date().toISOString()}); return; }
    const {error} = await sb.from("inquiries").insert(row); if (error) throw error;
  },
  async subscribe(row){
    if (DEMO) { demoDb.subs.unshift({...row, id:"s" + Date.now(), created_at:new Date().toISOString()}); return; }
    const {error} = await sb.from("subscribers").insert(row);
    if (error && error.code !== "23505") throw error;               // already subscribed counts as success
  },
  async track(row){ if (DEMO) return; try { await sb.from("page_views").insert(row); } catch {} },
  /* admin */
  async session(){
    if (DEMO) return state.demoAdmin ? {email:"demo@admin"} : null;
    const {data:{session}} = await sb.auth.getSession(); if (!session) return null;
    const {data} = await sb.from("admins").select("user_id").eq("user_id", session.user.id).maybeSingle();
    return data ? session.user : null;
  },
  async signIn(email, password){
    if (DEMO) { state.demoAdmin = true; return; }
    const {error} = await sb.auth.signInWithPassword({email, password}); if (error) throw error;
    if (!(await api.session())) { await sb.auth.signOut(); throw new Error("This account isn't an administrator."); }
  },
  async signOut(){ if (DEMO) state.demoAdmin = false; else await sb.auth.signOut(); },
  async inquiries(){
    if (DEMO) return [...demoDb.inquiries].sort((a, b) => b.created_at.localeCompare(a.created_at));
    const {data, error} = await sb.from("inquiries").select("*").eq("site", SITE.id).order("created_at", {ascending:false}).limit(1000);
    if (error) throw error; return data;
  },
  async newInquiryCount(){
    if (DEMO) return demoDb.inquiries.filter(i => i.status === "New").length;
    const {count, error} = await sb.from("inquiries").select("id", {count:"exact", head:true}).eq("site", SITE.id).eq("status", "New");
    if (error) throw error; return count || 0;
  },
  async updateInquiry(id, patch){
    if (DEMO) { Object.assign(demoDb.inquiries.find(i => i.id === id), patch); return; }
    const {error} = await sb.from("inquiries").update(patch).eq("id", id); if (error) throw error;
  },
  async removeInquiry(id){
    if (DEMO) { demoDb.inquiries = demoDb.inquiries.filter(i => i.id !== id); return; }
    const {error} = await sb.from("inquiries").delete().eq("id", id); if (error) throw error;
  },
  async allInsights(){
    if (DEMO) return [...demoDb.insights].sort((a, b) => b.created_at.localeCompare(a.created_at));
    const {data, error} = await sb.from("insights").select("*").eq("site", SITE.id).order("created_at", {ascending:false}).limit(500);
    if (error) throw error; return data;
  },
  async saveInsight(row){
    if (DEMO) {
      if (row.id) { Object.assign(demoDb.insights.find(i => i.id === row.id), row, {published_at: row.status === "Published" ? (demoDb.insights.find(i => i.id === row.id).published_at || new Date().toISOString()) : null}); return; }
      demoDb.insights.unshift({...row, id:"n" + Date.now(), site:SITE.id, created_at:new Date().toISOString(), published_at: row.status === "Published" ? new Date().toISOString() : null}); return;
    }
    const {id, ...rest} = row;

  async subscribers(){
    if (DEMO) return [...demoDb.subs].sort((a, b) => b.created_at.localeCompare(a.created_at));
    const {data, error} = await sb.from("subscribers").select("*").eq("site", SITE.id).order("created_at", {ascending:false}).limit(2000);
    if (error) throw error; return data;
  },
  async removeSub(id){
    if (DEMO) { demoDb.subs = demoDb.subs.filter(s => s.id !== id); return; }
    const {error} = await sb.from("subscribers").delete().eq("id", id); if (error) throw error;
  },
  async traffic(days){
    if (DEMO) {
      const by_day = []; for (let i = days - 1; i >= 0; i--) by_day.push({day:new Date(Date.now() - i * 864e5).toISOString().slice(0, 10), views:8 + ((i * 29) % 23)});
      const total = by_day.reduce((a, b) => a + b.views, 0);
      return {total_views:total, unique_visitors:Math.round(total * .55), subscribers:demoDb.subs.length, new_inquiries:demoDb.inquiries.filter(i => i.status === "New").length, by_day,
        by_path:[{path:"/", views:Math.round(total * .4)}, {path:SITE.primaryPath, views:Math.round(total * .25)}, {path:"/founders", views:Math.round(total * .15)}, {path:"/contact", views:Math.round(total * .1)}],

    }
    const {data, error} = await sb.rpc("traffic_summary", {p_site:SITE.id, p_days:days}); if (error) throw error; return data;
  }
};

async function track(path){
  try {
    if (DEMO || navigator.doNotTrack === "1" || navigator.globalPrivacyControl === true || isAdminBrowser()) return;
    await Promise.race([adminCheck, new Promise(r => setTimeout(r, 4000))]);
    if (isAdminBrowser() || !/^\/[a-z-]{0,30}$/.test(path)) return;
    const key = path + "|" + Math.floor(Date.now() / 3000); if (key === lastTrack) return; lastTrack = key;
    let ref = "";
    if (!sessionStorage.getItem("th_ref")) {
      sessionStorage.setItem("th_ref", "1");
      try { if (document.referrer) { const h = new URL(document.referrer).hostname; if (h && h !== location.hostname) ref = h; } } catch {}
    }
    api.track({site:SITE.id, path, referrer:ref.slice(0, 200), session_id:SESSION_ID});
  } catch {}
}

/* The five-colour page divider, drawn as rolling Caribbean waves. One seamless tile, repeated across the page and drifting slowly. */
function strataTile(){
  if (strataTile.done) return; strataTile.done = true;
  const cs = getComputedStyle(document.documentElement), fallback = ["#e0d5b6", "#c2a836", "#a0612a", "#1d6b62", "#172a3f"];
  const colour = i => cs.getPropertyValue("--s" + i).trim() || fallback[i - 1];
  const W = 240, H = 44, A = 7, band = 5.5, top = 8, step = 3;
  const edge = k => { const p = []; for (let x = 0; x <= W; x += step) p.push([x, top + band * k + A * Math.sin(2 * Math.PI * x / W + k * 0.35)]); return p; };   // each edge is one wave; the phase shifts a little from edge to edge so the stripes swell and thin like real swell
  const pts = p => p.map(([x, y]) => x + " " + y.toFixed(1)).join("L");
  const paths = [0, 1, 2, 3, 4].map(k => `<path fill="${colour(k + 1)}" d="M${pts(edge(k))}L${pts(edge(k + 1).reverse())}Z"/>`).join("");
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${paths}</svg>`;
  const st = document.createElement("style"); st.id = "strataTile"; st.textContent = `.strata{background-image:url("data:image/svg+xml,${encodeURIComponent(svg)}")}`; document.head.appendChild(st);
}
const strata = (thin = false) => { strataTile(); return `<div class="strata ${thin ? "thin" : ""}" aria-hidden="true"></div>`; };

/* Horizontal bar chart with a text-table fallback. rows: [{label, bars:[{v, note}]}], legend: [[name, colour]] */
function chart({title, unit, legend, rows, src, fmt}){
  const W = 640, left = 190, right = 120, bh = 20, gap = 6, rowPad = 14;
  const max = Math.max(...rows.flatMap(r => r.bars.map(b => b.v)));
  let y = 8, svg = "";
  rows.forEach(r => {
    const h = r.bars.length * (bh + gap);
    svg += `<text class="row-label" x="0" y="${y + h / 2 + 2}">${esc(r.label)}</text>`;
    r.bars.forEach((b, i) => {
      const w = Math.max(2, (b.v / max) * (W - left - right)), yy = y + i * (bh + gap);
      svg += `<rect x="${left}" y="${yy}" width="${w.toFixed(1)}" height="${bh}" rx="3" fill="${legend[i][1]}"/><text class="val" x="${(left + w + 8).toFixed(1)}" y="${yy + bh - 5}">${esc((fmt || (v => v))(b.v))}${b.note ? " (" + esc(b.note) + ")" : ""}</text>`;
    });
    y += h + rowPad;
  });
  const H = y;
  const table = `<table><caption class="sr-only">${esc(title)}</caption><thead><tr><th>Source</th>${legend.map(l => `<th>${esc(l[0])}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r.label)}</td>${r.bars.map(b => `<td>${esc((fmt || (v => v))(b.v))}${b.note ? " (" + esc(b.note) + ")" : ""}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  return `<figure class="chart"><figcaption>${esc(title)}</figcaption>
    <div class="legend">${legend.map(l => `<span style="--c:${l[1]}">${esc(l[0])}</span>`).join("")}</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}. Open the data table below for the exact values."><line class="axis" x1="${left}" y1="0" x2="${left}" y2="${H}"/>${svg}</svg>
    <details><summary>View the data table</summary>${table}</details>
    <p class="src">${src}</p></figure>`;
}

/* ---------- Router ---------- */
function parseHash(){
  const h = location.hash.slice(1) || "/", [path, q] = h.split("?");
  return {path: path.startsWith("/") ? path : "/" + path, query: Object.fromEntries(new URLSearchParams(q || ""))};
}
function setView(html, title, mount, opts = {}){
  app().innerHTML = html;
  document.title = title ? `${title} – ${SITE.name}` : `${SITE.name}: ${SITE.tagline}`;
  if (!opts.keepScroll) window.scrollTo(0, 0);
  const h = $("h1", app()); if (h) { h.tabIndex = -1; h.focus({preventScroll:true}); }
  if (mount) mount();
}
function route(){
  const {path, query} = parseHash(); closeNav(); updateNav(path);
  if (path === "/" + ADMIN_PATH) return showAdmin();
  if (path.startsWith("/insights/")) { track("/insights"); return showInsight(path.slice(10)); }
  const page = SITE.pages[path];
  if (!page) { location.hash = "#/"; return; }
  const out = page({query});
  setView(out.html, out.title, out.mount, {keepScroll:!!query.s});
  track(path);
}
window.addEventListener("hashchange", route);

function founderHtml(f, i){
  const colors = ["#9a4529","#1d6b62"], c = colors[i % 2];
  const okPhoto = /^[\w\/.-]+\.(jpe?g|png|webp|gif)$/i.test(f.photo || "") && !/\.\./.test(f.photo);
  const fb = FOUNDER_PHOTOS[f.key] || "", hasPhoto = okPhoto || !!fb;
  const photo = hasPhoto ? `<img src="${okPhoto ? esc(f.photo) : fb}" ${okPhoto && fb ? `data-fb="${fb}"` : ""} alt="Portrait of ${esc(f.name)}">` : esc(f.initials);
  return `<article class="founder" aria-labelledby="f-${f.key}">
    <div><div class="avatar" style="background:${c}" role="img" aria-label="${esc(hasPhoto ? "Portrait of " + f.name : "Initials " + f.initials)}">${photo}<span class="band" aria-hidden="true"><i style="background:#d8cba1"></i><i style="background:#c2a836"></i><i style="background:#9a4529"></i><i style="background:#1d6b62"></i><i style="background:#123f3a"></i></span></div></div>
    <div><h3 id="f-${f.key}">${esc(f.name)}</h3><p class="role">${esc(f.role)}</p>
      ${f.intro.map(p => `<p>${esc(p)}</p>`).join("")}
      <ul class="pillrow" aria-label="Areas of focus">${f.focus.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      <dl class="dl">${f.facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v.length > 1 ? `<ul class="list-plain" style="margin:0">${v.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : esc(v[0])}</dd>`).join("")}</dl>
      ${f.pubs.length ? `<h4>Selected publications</h4><ol class="pubs">${f.pubs.map(p => typeof p === "string" ? `<li>${esc(p)}</li>` : `<li>${esc(p[0])} <a href="${esc(safeUrl(p[1]))}" target="_blank" rel="noopener noreferrer" aria-label="${esc(p[2])} (opens in a new tab)">${esc(p[2])}</a></li>`).join("")}</ol>` : ""}
      ${f.links.map(([l, u]) => `<p><a class="btn ghost small" href="${esc(safeUrl(u))}" target="_blank" rel="noopener noreferrer" aria-label="${esc(l)} (opens in a new tab)">${esc(l)} &#8599;</a></p>`).join("")}</div></article>`;
}
function foundersPage(){

    mount(){ $$(".avatar img[data-fb]").forEach(im => { const use = () => { if (im.dataset.fb) { const b = im.dataset.fb; im.dataset.fb = ""; im.src = b; } }; im.addEventListener("error", use); if (im.complete && im.naturalWidth === 0) use(); }); }};
}
function pageHead(title, lede){
  return `${strata()}<header class="section tint" style="padding-bottom:2.2rem"><div class="wrap"><h1>${esc(title)}</h1>${lede ? `<p class="lede" style="margin-top:1rem">${esc(lede)}</p>` : ""}</div></header>`;
}

function syncContactTopic(){

/* ---------- Insights ---------- */
function renderBody(body){
  const blocks = String(body).replace(/\r/g, "").split(/\n{2,}/), out = [];
  blocks.forEach(b => {
    const lines = b.split("\n");
    if (/^## /.test(b)) { out.push(`<h3>${esc(b.replace(/^## /, "").trim())}</h3>`); return; }
    if (lines.every(l => /^- /.test(l))) { out.push(`<ul>${lines.map(l => `<li>${esc(l.replace(/^- /, ""))}</li>`).join("")}</ul>`); return; }
    out.push(`<p>${esc(b).replace(/\n/g, "<br>")}</p>`);
  });
  return out.join("");
}
function insightsPage(){
  return {title:"Insights", html:`${pageHead("Insights", SITE.insightsLede)}<section class="section"><div class="wrap"><div id="insList" class="grid g2" aria-live="polite"><div class="empty" style="grid-column:1/-1"><p>Loading articles…</p></div></div></div></section>`,
    async mount(){
      const el = $("#insList");
      try {
        const rows = await api.insights();
        el.innerHTML = rows.length ? rows.map(r => `<article class="post"><div class="meta">${esc(r.category)} &middot; ${esc(fmtDate(r.published_at))}</div><h3><a href="#/insights/${esc(r.id)}">${esc(r.title)}</a></h3><p>${esc(r.summary)}</p><p><a href="#/insights/${esc(r.id)}">Read the article</a></p></article>`).join("")
          : `<div class="empty" style="grid-column:1/-1"><h3>Our first articles are on the way</h3><p>Subscribe below and we will email you when they are published.</p></div>`;
      } catch (e) { console.error(e); el.innerHTML = `<div class="empty" style="grid-column:1/-1"><h3>We couldn't load the articles</h3><p>Check your connection and try again.</p></div>`; }
    }};
}
async function showInsight(id){
  if (!DEMO && !/^[0-9a-f-]{36}$/i.test(id)) return setView(`${strata()}<section class="section"><div class="wrap article"><a class="back" href="#/insights">&lsaquo; All insights</a><h1>Article not found</h1><p>It may have been unpublished or moved. <a href="#/insights">See all insights</a>.</p></div></section>`, "Not found");
  setView(`${strata()}<section class="section"><div class="wrap article"><a class="back" href="#/insights">&lsaquo; All insights</a><p>Loading…</p></div></section>`, "Insights");

/* ---------- Forms: contact, subscribe, chat (delegated) ---------- */
document.addEventListener("submit", async e => {
  const f = e.target;
  if (f.id === "contactForm") {
    e.preventDefault();
    const err = $("#c-err"), btn = $("#c-send"); err.textContent = "";
    if ($("#c-web").value) return;
    const topic = SITE.contactTopics.find(t => t.id === $("#c-topic").value), name = $("#c-name").value.trim(), email = $("#c-email").value.trim().toLowerCase();
    const org = $("#c-org").value.trim(), role = $("#c-role").value.trim(), msg = $("#c-msg").value.trim();
    if (name.length < 2) return err.textContent = "Enter your name.";
    if (!EMAIL_RE.test(email) || email.length > 254) return err.textContent = "Enter a valid email address so we can reply.";
    if (topic.org && org.length < 2) return err.textContent = "Enter your organisation for this kind of request.";
    if (msg.length < 10) return err.textContent = "Tell us a little more: at least 10 characters.";
    if (!$("#c-consent").checked) return err.textContent = "Tick the box to agree that we may contact you.";
    if (Date.now() - lastSend < 15000) return err.textContent = "Please wait a few seconds before sending again.";
    btn.disabled = true; btn.textContent = "Sending…";
    try {
      await api.sendInquiry({site:SITE.id, source:"form", topic:topic.label, name, email, organization:org || null, role:role || null, message:msg, consent:true});
      lastSend = Date.now();
      $("#contactForm").outerHTML = `<div class="panel" role="status"><h2 style="font-size:1.5rem;margin-bottom:.6rem">Thank you, ${esc(name.split(" ")[0])}</h2><p>We have your message and will reply to ${esc(email)}. ${esc(SITE.replyTime)}</p><p><a class="btn ghost" href="#/insights">Read our insights</a></p></div>`;
    } catch (ex) { console.error(ex); err.textContent = isLimited(ex) ? "You have sent several messages recently. Please try again later." : "We couldn't send your message. Check your connection and try again."; btn.disabled = false; btn.textContent = "Send message"; }
  }
  if (f.classList.contains("subscribe-form")) {
    e.preventDefault();
    const err = $(".sub-err", f); err.textContent = "";
    if ($(".hp", f).value) return;
    const email = $("input[type=email]", f).value.trim().toLowerCase();
    if (!EMAIL_RE.test(email) || email.length > 254) return err.textContent = "Enter a valid email address.";
    if (!$(".fs-consent", f).checked) return err.textContent = "Tick the box to agree to receive updates.";
    if (Date.now() - lastSub < 10000) return err.textContent = "Please wait a few seconds and try again.";
    const btn = $("button", f); btn.disabled = true;
    try { await api.subscribe({site:SITE.id, email, consent:true}); lastSub = Date.now(); f.reset(); toast("Thank you! You're subscribed.", "ok"); }
    catch (ex) { console.error(ex); err.textContent = isLimited(ex) ? "Too many sign-ups from this connection. Please try again later." : "We couldn't sign you up. Try again in a moment."; }
    finally { btn.disabled = false; }
  }
  if (f.id === "chatForm") {
    e.preventDefault();
    const err = $("#ch-err"), btn = $("#ch-send"); err.textContent = "";
    if ($("#ch-web").value) return;
    const q = $("#ch-text").value.trim(), email = $("#ch-email").value.trim().toLowerCase();
    if (q.length < 3) return err.textContent = "Type your question first.";
    if (email && (!EMAIL_RE.test(email) || email.length > 254)) return err.textContent = "That email address doesn't look right.";
    if (Date.now() - lastAsk < 10000) return err.textContent = "Please wait a few seconds before sending another question.";
    btn.disabled = true; btn.textContent = "Sending…";
    try {
      await api.sendInquiry({site:SITE.id, source:"chat", topic:"Chat question", name:null, email:email || null, message:q, consent:false});
      lastAsk = Date.now();
      const log = $("#chatLog");
      log.insertAdjacentHTML("beforeend", bubble("me", q) + bubble("bot", email ? `Thanks! We have your question and will reply to ${email}.` : "Thanks! We have your question. You didn't leave an email, so we can't reply directly. Add one next time if you'd like an answer."));
      log.scrollTop = log.scrollHeight; $("#ch-text").value = "";
    } catch (ex) { console.error(ex); err.textContent = isLimited(ex) ? "You have sent a lot of questions. Please try again later." : "We couldn't send that. Check your connection and try again."; }
    finally { btn.disabled = false; btn.textContent = "Send"; }
  }
});
let lastSend = 0, lastSub = 0, lastAsk = 0;
const bubble = (who, text) => `<div class="bubble ${who}">${esc(text)}</div>`;
function setChat(open){
  $("#chatPanel").hidden = !open; $("#chatFab").hidden = open; $("#chatFab").setAttribute("aria-expanded", String(open));
  if (!open) return $("#chatFab").focus();
  if (!$("#chatLog").children.length) $("#chatLog").innerHTML = bubble("bot", SITE.chatGreeting);
  $("#ch-err").textContent = ""; $("#ch-text").focus();
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#chatPanel") && !$("#chatPanel").hidden) setChat(false); });
document.addEventListener("click", e => {
  if (e.target.closest("#chatFab")) return setChat(true);
  if (e.target.closest("#chatClose")) return setChat(false);
  const tg = e.target.closest("#navToggle");
  if (tg) { const open = $("#nav").classList.toggle("open"); tg.setAttribute("aria-expanded", String(open)); }
  const nb = e.target.closest("#netBtn");
  if (nb) return setNet(nb.getAttribute("aria-expanded") !== "true");
  if (!e.target.closest(".netmenu")) setNet(false);   // a click anywhere else closes the companies menu
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#netBtn")?.getAttribute("aria-expanded") === "true") { setNet(false); $("#netBtn").focus(); } });
document.addEventListener("focusin", e => { if (!e.target.closest(".netmenu")) setNet(false); });   // tabbing away closes it
document.addEventListener("keydown", e => { if (e.target.id === "ch-text" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#chatForm").requestSubmit(); } });

async function showAdmin(){
  state.isAdmin = !!(await api.session()); await updateNav2();
  if (!state.isAdmin) {
    setView(`${strata()}<section class="section"><div class="wrap admin"><a class="back" href="#/">&lsaquo; Back to the site</a><h1>Administrator sign in</h1>
      <p class="muted">Sign in to read messages, write insights and see traffic.${DEMO ? " <b>Demo mode:</b> any email and password will work." : ""}</p>
      <form class="login-card f" id="loginForm" novalidate>
        <div class="field"><label for="li-email">Email</label><input id="li-email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="li-pass">Password</label><div class="pw"><input id="li-pass" type="password" autocomplete="current-password" required><button class="pwbtn" type="button" id="pwToggle" aria-pressed="false" aria-controls="li-pass">Show</button></div></div>
        <p class="err" id="li-err" role="alert"></p><button class="btn" type="submit">Sign in</button></form></div></section>`, "Admin");
    $("#pwToggle").addEventListener("click", e => { const i = $("#li-pass"), show = i.type === "password"; i.type = show ? "text" : "password"; e.target.textContent = show ? "Hide" : "Show"; e.target.setAttribute("aria-pressed", String(show)); i.focus(); });
    $("#loginForm").addEventListener("submit", async e => {
      e.preventDefault();
      try { await api.signIn($("#li-email").value.trim(), $("#li-pass").value); await updateNav2(); showAdmin(); }
      catch (ex) {
        console.error("Sign-in error:", ex); const m = String(ex?.message || "");
        $("#li-err").textContent = m.includes("administrator") ? m : /invalid login/i.test(m) ? "Email or password is incorrect."
          : /not confirmed/i.test(m) ? "This email hasn't been confirmed yet. Confirm the user in Supabase (Authentication > Users)."
          : /disabled/i.test(m) ? "Email sign-in is turned off in Supabase (Authentication > Providers > Email)."
          : "Sign-in failed: " + (m || "unknown error. Open the browser console (F12) for details.");
      }
    });
    return;
  }
  store.set("admin", true);
  setView(`${strata()}<section class="section"><div class="wrap admin"><div style="display:flex;gap:1rem;justify-content:space-between;align-items:flex-start;flex-wrap:wrap">
    <div><h1>Admin: ${esc(SITE.name)}</h1><p class="muted" style="margin:0">Messages, insights, subscribers and traffic for this site.</p></div>
    <button class="btn ghost small" type="button" id="signOut">Sign out</button></div>
    <div class="tabs" id="admTabs" role="group" aria-label="Admin sections"></div><div id="admBody"></div></div></section>`, "Admin");
  $("#signOut").addEventListener("click", async () => { await api.signOut(); state.isAdmin = false; store.set("admin", false); await updateNav2(); location.hash = "#/"; toast("Signed out."); });
  renderAdminTab(); refreshNew();
}

/* ----- Inbox ----- */
async function showInbox(){
  const el = $("#admBody"); el.innerHTML = '<p class="muted">Loading…</p>';

  catch (e) { console.error(e); el.innerHTML = `<div class="empty"><h3>Couldn't load messages</h3><p>Make sure you ran thermo_setup.sql and that you are signed in as the administrator.</p></div>`; }

function inqFiltered(){
  const f = state.inqFilter, q = f.q.trim().toLowerCase();
  return state.inq.filter(i => (f.status === "All" || i.status === f.status) && (f.source === "All" || i.source === f.source) &&
    (!q || [i.name, i.email, i.organization, i.message, i.topic].join(" ").toLowerCase().includes(q)));
}
function renderInbox(){
  const f = state.inqFilter;
  $("#admBody").innerHTML = `<div class="afilters">
    <label class="sr-only" for="if-status">Status</label><select id="if-status">${["All", ...STATUSES].map(s => `<option ${s === f.status ? "selected" : ""}>${s}</option>`).join("")}</select>
    <label class="sr-only" for="if-source">Source</label><select id="if-source">${[["All", "All sources"], ["form", "Contact form"], ["chat", "Chat"]].map(([v, l]) => `<option value="${v}" ${v === f.source ? "selected" : ""}>${l}</option>`).join("")}</select>
    <label class="sr-only" for="if-q">Search</label><input id="if-q" type="search" placeholder="Search name, email, organisation or message" value="${esc(f.q)}"></div>
    <div class="arow-actions" style="margin-bottom:.8rem"><span class="muted" id="inqCount"></span><button class="btn ghost small" type="button" id="inqCsv">Download CSV</button></div>
    <div id="inqList" class="alist"></div>`;
  $("#if-status").addEventListener("change", e => { f.status = e.target.value; renderInqList(); });
  $("#if-source").addEventListener("change", e => { f.source = e.target.value; renderInqList(); });
  $("#if-q").addEventListener("input", e => { f.q = e.target.value; renderInqList(); });
  $("#inqCsv").addEventListener("click", () => downloadCsv("inquiries.csv", [["Received","Status","Source","Topic","Name","Email","Organisation","Role","Message","Notes"], ...inqFiltered().map(i => [i.created_at, i.status, i.source, i.topic, i.name, i.email, i.organization, i.role, i.message, i.admin_notes])]));
  renderInqList();
}
function renderInqList(){
  const list = inqFiltered(), el = $("#inqList"); if (!el) return;
  $("#inqCount").textContent = `${list.length} of ${state.inq.length} messages`;
  el.innerHTML = list.length ? list.map(i => {
    const reply = i.email ? `mailto:${i.email}?subject=${encodeURIComponent("Re: your message to " + SITE.name)}&body=${encodeURIComponent("Hi" + (i.name ? " " + i.name.split(" ")[0] : "") + ",\n\nThank you for getting in touch. You wrote:\n\"" + i.message + "\"\n\n")}` : "";
    return `<div class="arow ${i.status === "New" ? "new" : ""}" data-id="${esc(i.id)}">

/* ----- Traffic ----- */
async function showTraffic(){
  const el = $("#admBody"); el.innerHTML = '<p class="muted">Loading…</p>';
  try { renderTraffic(await api.traffic(state.days)); }
  catch (e) { console.error(e); el.innerHTML = `<div class="empty"><h3>Couldn't load traffic</h3><p>Make sure you ran thermo_setup.sql and are signed in as the administrator.</p></div>`; }
}
function renderTraffic(t){
  const days = state.days, map = Object.fromEntries((t.by_day || []).map(d => [String(d.day).slice(0, 10), Number(d.views)])), series = [];
  for (let i = days - 1; i >= 0; i--) { const d = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10); series.push([d, map[d] || 0]); }
  const max = Math.max(1, ...series.map(x => x[1]));
  const rank = (rows, label) => { const m = Math.max(1, ...rows.map(r => Number(r.views))); return rows.length ? `<div class="rank">${rows.map(r => `<div class="rank-row"><span>${esc(label(r))}</span><span class="rank-bar"><i style="width:${Number(r.views) / m * 100}%"></i></span><b>${Number(r.views)}</b></div>`).join("")}</div>` : `<p class="muted">No data yet.</p>`; };
  $("#admBody").innerHTML = `<div class="tabs" role="group" aria-label="Date range">${[7, 30, 90].map(n => `<button class="tab" type="button" data-days="${n}" aria-pressed="${days === n}">Last ${n} days</button>`).join("")}</div>
    <div class="stats"><div class="stat"><b>${Number(t.total_views || 0)}</b><span>Page views</span></div><div class="stat"><b>${Number(t.unique_visitors || 0)}</b><span>Visits (browser sessions)</span></div><div class="stat"><b>${Number(t.new_inquiries || 0)}</b><span>New messages</span></div><div class="stat"><b>${Number(t.subscribers || 0)}</b><span>Subscribers</span></div></div>
    <div class="panel" style="margin:.8rem 0"><h2 style="font-size:1.1rem;margin-bottom:.8rem">Page views per day</h2><div class="bars" role="img" aria-label="Bar chart of page views per day">${series.map(([d, v]) => `<i style="height:${Math.max(2, v / max * 100)}%" title="${d}: ${v} views"></i>`).join("")}</div></div>
    <div class="grid g2"><div class="panel"><h2 style="font-size:1.1rem;margin-bottom:.8rem">Most visited pages</h2>${rank(t.by_path || [], r => r.path === "/" ? "Home" : r.path)}</div><div class="panel"><h2 style="font-size:1.1rem;margin-bottom:.8rem">Where visitors came from</h2>${rank(t.by_referrer || [], r => r.ref)}</div></div>
    <p class="note" style="margin-top:1rem">Cookie-free: visits are counted per browser tab session and no IP addresses are stored. Your own visits are not counted while you are signed in as admin on this browser.</p>`;
}
document.addEventListener("click", e => { const b = e.target.closest("[data-days]"); if (b && $("#admBody")) { state.days = Number(b.dataset.days); showTraffic(); } });

/* ----- CSV ----- */
const csvCell = v => { let t = String(v ?? ""); if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; return '"' + t.replace(/"/g, '""') + '"'; };
function downloadCsv(name, rows){
  const blob = new Blob(["\ufeff" + rows.map(r => r.map(csvCell).join(",")).join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

  <section class="section"><div class="wrap">${SERVICES.map(s => `<article class="service" id="${s.id}"><div class="ico">${icon(s.icon)}</div><div><h3>${esc(s.title)}</h3><p style="margin-bottom:.2rem">${esc(s.line)}</p>
      <h4>What you get</h4><ul>${s.get.map(x => `<li>${esc(x)}</li>`).join("")}</ul><h4>A good fit if</h4><p>${esc(s.fit)}</p>
      <p><a class="btn small" href="#/contact?topic=${s.id === "ip" || s.id === "partners" ? "other" : s.id}">Talk to us about this</a></p></div></article>`).join("")}</div></section>`,

"/outlook": () => ({title:"Outlook", html:`${pageHead("Outlook", "Where demand for careful, practical science is growing in the Caribbean and beyond, and where ThermoDen fits.")}
  <section class="section"><div class="wrap"><div class="head"><h2>Coastal environmental pressures</h2><p class="lede">Sargassum inundations are no longer occasional events. Communities and institutions need dependable, affordable ways to measure and report what is happening.</p></div>
    <div class="facts"><div class="fact"><b>37.5 million</b><p>metric tonnes of sargassum were recorded in the Atlantic in May 2025, the highest total since monitoring began in 2011.</p><small>UNEP Caribbean Environment Programme</small></div>
      <div class="fact"><b>US$120 million</b><p>was the estimated cost of cleaning up excess sargassum across the Caribbean in 2018.</p><small>US Environmental Protection Agency</small></div>
      <div class="fact"><b>119,000 tonnes</b><p>of sargassum were projected to reach Quintana Roo, Mexico, in 2026, up from a record 96,000 the year before. The state's governor puts the cost at about 11% of its economy.</p><small>Reuters, 28 July 2026</small></div></div>
    <p class="note" style="margin-top:.8rem">Rotting sargassum also releases hydrogen sulfide gas, which can cause respiratory problems (UNEP). <b>Where we fit:</b> environmental and public-health monitoring design.</p></div></section>
  <section class="section tint"><div class="wrap split"><div><h2>Drug-resistant infections</h2><p>Antimicrobial resistance directly caused an estimated 1.14 million deaths in 2021, and the forecast is 1.91 million a year by 2050 (The Lancet, 2024). Surveillance and diagnosis depend on well-run laboratories and trained staff.</p><p><b>Where we fit:</b> laboratory systems and documentation, and workforce training.</p></div>
    <div><h2>A growing biotechnology workforce</h2><p>Market reports project plasmid DNA and viral-vector manufacturing to grow by roughly 19% to 20% a year through 2033 (Astute Analytica; Allied Market Research). Growth like that needs people who can work to documented standards.</p><p><b>Where we fit:</b> STEM education, training and IP readiness.</p></div></div></section>
  <section class="section"><div class="wrap"><div class="head"><h2>What this means for you</h2></div>
    <div class="grid g3"><article class="card"><h3>If you run a research group</h3><p>Funders and journals expect clear designs and clean records. We help you build both.</p></article><article class="card c2"><h3>If you lead an institution</h3><p>Training and procedures turn individual skill into lasting capacity.</p></article><article class="card c3"><h3>If you are an early-stage company</h3><p>Good documentation and well-timed disclosure keep your options open when partners and investors arrive.</p></article></div>
    <div class="actions"><a class="btn accent" href="#/contact?topic=call">Book an introductory call</a><a class="btn ghost" href="#/services">See our services</a></div>
    <p class="note" style="margin-top:1.4rem">Figures are from the sources named under each statistic. They are third-party estimates and may be revised. This page describes market conditions, not a promise of any outcome.</p></div></section>`}),

"/founders": () => foundersPage(),

"/about": () => ({title:"About", html:`${pageHead("About ThermoDen", "A small consultancy that helps good science get funded, documented and delivered.")}
  <section class="section"><div class="wrap split"><div><h2>Who we are</h2><p>ThermoDen is a scientific consulting company founded by Denver Jn. Baptiste and Jamille Jn. Baptiste. We help research groups, institutions and early-stage companies plan studies, set up laboratory systems, write proposals, train staff and run projects.</p>
      <p>We started ThermoDen because good science in the Caribbean often runs into the same practical limits: small teams, limited infrastructure and few people to show you the way. We aim to be those people.</p>
      <h2 style="margin-top:2rem">Who we work with</h2><p>Universities and schools, research institutions, community and public-health organisations, coastal communities, and early-stage companies in the Caribbean and beyond.</p></div>
    <div class="grid" style="gap:1rem"><div class="card"><h3>Be honest about limits</h3><p>We tell you what is realistic, including when we are not the right fit.</p></div><div class="card c2"><h3>Document everything</h3><p>Clear records make work repeatable, fundable and defensible.</p></div><div class="card c3"><h3>Teach as we go</h3><p>We want you to be able to run things yourselves when we leave.</p></div><div class="card c4"><h3>Start from local context</h3><p>Good plans fit the people, languages and constraints of the place.</p></div></div></div></section>
  <section class="section tint"><div class="wrap split"><div><h2>Our daughter company</h2><p>ThermoGen Biotech is ThermoDen's research and development company. It is a separate company with its own website, focused on microbes from Caribbean geothermal springs and their use in medicine and the environment. We share founders, and we keep the two companies' work separate so clients and partners always know who they are dealing with.</p>
      <p><a class="btn ghost" href="${esc(THERMOGEN_URL)}" target="_blank" rel="noopener noreferrer">Visit ThermoGen Biotech <span class="sr-only">(opens in a new tab)</span>&#8599;</a></p></div>
    <div><h2>Work with us</h2><p>Tell us what you are working on. We will suggest a sensible next step.</p><p><a class="btn accent" href="#/contact?topic=call">Book an introductory call</a></p></div></div></section>
  <section class="section"><div class="wrap split"><div><h2>Companies we sponsor and advise</h2><p>ThermoDen acts as sponsor and consultant to each of these companies, giving practical guidance on planning, documentation and delivery. They are independent companies with their own websites, and each is responsible for its own products, services and policies.</p></div>
    <div>${networkLinks()}</div></div></section>`}),

"/insights": () => insightsPage(),
